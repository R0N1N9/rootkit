cmd('head','basics','first lines','head — first lines of a file or piped input.\n  head -n 5 file',(a,ctx,si)=>{ const ni=a.indexOf('-n'); const n=ni>=0?+a[ni+1]:10; const rest=a.filter((x,i)=>i!==ni&&i!==ni+1);
  const r=readArg(ctx,rest,si,'head'); if(r.err) return txt(r.err,1); return txt(r.c.split('\n').slice(0,n).join('\n')); });
cmd('tail','basics','last lines','tail — last lines of a file. Defenders live in tail: tail -n 20 /var/log/auth.log',
 (a,ctx,si)=>{ const ni=a.indexOf('-n'); const n=ni>=0?+a[ni+1]:10; const rest=a.filter((x,i)=>i!==ni&&i!==ni+1);
  const r=readArg(ctx,rest,si,'tail'); if(r.err) return txt(r.err,1); if(r.p) ctx.ev('read',r.p); return txt(r.c.split('\n').slice(-n).join('\n')); });
cmd('grep','basics','search text','grep — find lines matching a pattern.\n  grep Failed /var/log/auth.log\n  -i ignore case · -v invert · -r search a whole folder\nPipe into it: cat file | grep word',
 (a,ctx,si)=>{ const fl=a.filter(x=>x[0]==='-').join(''); const pos=a.filter(x=>x[0]!=='-'); const pat=pos[0]; if(!pat) return txt('usage: grep PATTERN [FILE]',1);
   const re=new RegExp(pat.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),fl.includes('i')?'i':'');
   const keep=l=>re.test(l)!==fl.includes('v');
   if(fl.includes('r')){ const root=resolve(ctx,pos[1]||'.'); const hits=[];
     for(const k of Object.keys(ctx.h.fs).sort()) if((k===root||k.startsWith(root==='/'?'/':root+'/'))&&ctx.h.fs[k].t==='f'&&canRead(ctx,ctx.h.fs[k]))
       for(const l of ctx.h.fs[k].c.split('\n')) if(keep(l)) hits.push(`<span class="hl">${esc(k)}</span>:${esc(l)}`);
     ctx.ev('grep',pat); return {o:hits.join('\n'),h:1}; }
   const r=readArg(ctx,pos.slice(1),si,'grep'); if(r.err) return txt(r.err,1); ctx.ev('grep',pat);
   if(r.p) ctx.ev('read',r.p);
   return txt(r.c.split('\n').filter(keep).join('\n')); });
cmd('wc','basics','count lines','wc -l — count lines. ps aux | wc -l tells you how many processes are running.',(a,ctx,si)=>{ const r=readArg(ctx,a,si,'wc'); if(r.err) return txt(r.err,1); return txt(String(r.c.split('\n').filter(Boolean).length)); });
cmd('sort','basics','sort lines','sort — sort lines. Pair with uniq -c to count repeats: ... | sort | uniq -c',(a,ctx,si)=>{ const r=readArg(ctx,a,si,'sort'); if(r.err) return txt(r.err,1); return txt(r.c.split('\n').sort().join('\n')); });
cmd('uniq','basics','collapse repeats','uniq -c — collapse repeated lines and count them. Great for spotting the noisiest IP in a log.',
 (a,ctx,si)=>{ const r=readArg(ctx,a,si,'uniq'); if(r.err) return txt(r.err,1); const ls=r.c.split('\n'); const o=[]; let prev=null,c=0;
  for(const l of ls.concat([null])){ if(l===prev){c++;continue;} if(prev!==null) o.push(a.includes('-c')?`${String(c).padStart(4)} ${prev}`:prev); prev=l;c=1; } return txt(o.join('\n')); });
cmd('find','basics','search the filesystem','find — search for files by property.\n  find / -name "*.conf"\n  find / -perm -4000   SUID binaries (run as their owner)\n  find / -perm -o+w    world-writable files (anyone can edit)\n  find /tmp -type f',
 (a,ctx)=>{ const start=resolve(ctx,a[0]&&a[0][0]!=='-'?a[0]:'.'); const nm=a.indexOf('-name'), pm=a.indexOf('-perm'), tp=a.indexOf('-type');
   const name=nm>=0?(a[nm+1]||'').replace(/^["']|["']$/g,''):null, perm=pm>=0?a[pm+1]:null, type=tp>=0?a[tp+1]:null;
   const re=name?new RegExp('^'+name.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$'):null;
   const out=[];
   for(const k of Object.keys(ctx.h.fs).sort()){ if(!(k===start||k.startsWith(start==='/'?'/':start+'/')))continue; const n=ctx.h.fs[k];
     if(type==='f'&&n.t!=='f')continue; if(type==='d'&&n.t!=='d')continue;
     if(re&&!re.test(base(k)))continue;
     if(perm==='-4000'||perm==='/4000'||perm==='-u=s'){ if(!(n.m&&n.m.length===4&&n.m[0]==='4'))continue; }
     if(perm==='-o+w'||perm==='-002'||perm==='/o+w'){ if(!(+(n.m||'0644').slice(-1)&2))continue; }
     out.push(k); }
   ctx.ev('find',perm||name||type||''); return txt(out.join('\n')); });
cmd('history','basics','your past commands','history — every command you have typed. Defenders read ~/.bash_history on a compromised box to see what an intruder ran.',
 (a,ctx)=>txt(ctx.hist.map((l,i)=>`${String(i+1).padStart(4)}  ${l}`).join('\n')));

// ---- red: recon + access
cmd('nmap','recon','scan a host for open ports','nmap — the network mapper. Sends probes to find which ports are open and what is listening.\n  nmap 10.10.10.5       scan common ports\n  nmap -sV 10.10.10.5   also guess service versions\nATT&CK T1046. Only scan systems you have permission to test.',
 (a,ctx)=>{ const ip=a.find(x=>x[0]!=='-'); if(!ip) return txt('usage: nmap [-sV] <target>',1); const t=ctx.sc.net[ip];
   if(!t) return txt(`Note: Host seems down. If it is really up, but blocking our ping probes, try -Pn\nNmap done: 1 IP address (0 hosts up)`);
   const v=a.includes('-sV');
   let o=`Starting Nmap 7.94 ( https://nmap.org )\nNmap scan report for ${t.name} (${ip})\nHost is up (0.021s latency).\n<b>PORT     STATE SERVICE${v?'  VERSION':''}</b>\n`;
   for(const [p,s] of Object.entries(t.ports)) o+=`<span class="ok">${(p+'/tcp').padEnd(9)}open</span>  ${s[0].padEnd(7)}${v?' '+esc(s[1]):''}\n`;
   ctx.ev('nmap',ip); return {o:o+`\nNmap done: 1 IP address (1 host up) scanned`,h:1}; });
cmd('curl','recon','fetch a web page','curl — makes an HTTP request and prints the response. How you read a website without a browser.\n  curl http://10.10.10.5/\n  curl http://10.10.10.5/robots.txt\nrobots.txt tells search engines what NOT to index — which often points at the interesting stuff.',
 (a,ctx)=>{ const u=a.find(x=>x[0]!=='-'); if(!u) return txt('usage: curl <url>',1);
   const m=u.match(/^(?:https?:\/\/)?([^/:]+)(?::\d+)?(\/.*)?$/); if(!m) return txt('curl: (3) URL malformed',1);
   const t=ctx.sc.net[m[1]]; if(!t||!t.web) return txt(`curl: (7) Failed to connect to ${m[1]} port 80: Connection refused`,1);
   const path=m[2]||'/'; const page=t.web[path]!=null?t.web[path]:t.web[path.replace(/\/$/,'')];
   ctx.ev('curl',path); if(page==null) return txt(`<html><title>404 Not Found</title><h1>Not Found</h1></html>`);
   return txt(page); });
cmd('ssh','access','log in to a remote machine','ssh — secure shell: log in to another machine over the network.\n  ssh user@host\nIt asks for a password or uses a key. Reused or leaked credentials are one of the most common ways in (ATT&CK T1078: Valid Accounts).',
 (a,ctx)=>{ const t=a.find(x=>x.includes('@')); if(!t) return txt('usage: ssh user@host',1); const [u,hst]=t.split('@');
   const tgt=ctx.sc.net[hst]; if(!tgt||!tgt.ports[22]) return txt(`ssh: connect to host ${hst} port 22: Connection refused`,1);
   const acct=tgt.users&&tgt.users[u]; if(!acct||!ctx.st[acct.need]) return txt(`${u}@${hst}: Permission denied (publickey,password).\n<span class="dim">You need valid credentials first.</span>`.replace(/<[^>]+>/g,''),1);
   ctx.stack.push(ctx.h); ctx.h=ctx.hosts[hst]; ctx.ev('ssh',u);
   return {o:`${esc(u)}@${esc(hst)}'s password: <span class="dim">(using the password you found)</span>\n<span class="ok">Welcome to Ubuntu 22.04.4 LTS</span>\nLast login: Thu Nov 14 02:13:08 2026 from 10.10.14.2\n<span class="dim">type exit to return to your own machine</span>`,h:1}; });
cmd('exit','access','leave the remote shell','exit — closes the current shell. After ssh, it drops you back on your own machine.',
 (a,ctx)=>{ if(!ctx.stack.length) return txt('exit: you are on your own machine (use ‹ to leave the mission)'); ctx.h=ctx.stack.pop(); return txt('Connection closed.'); });
cmd('sudo','access','run a command as root','sudo — run one command as another user, usually root.\n  sudo -l   list what YOU are allowed to run as root\nA careless sudo rule is a classic privilege-escalation path (ATT&CK T1548.003). Defenders: audit /etc/sudoers.',
 (a,ctx,si)=>{ if(a[0]==='-l'){ ctx.ev('sudol'); const r=ctx.h.sudo; if(!r) return txt(`Sorry, user ${ctx.h.user} may not run sudo on ${ctx.h.host}.`);
     return txt(`Matching Defaults entries for ${ctx.h.user} on ${ctx.h.host}:\n    env_reset, secure_path=/usr/sbin\\:/usr/bin\n\nUser ${ctx.h.user} may run the following commands on ${ctx.h.host}:\n    ${r}`); }
   if(!a.length) return txt('usage: sudo -l | sudo <command>',1);
   const c=a[0].replace(/^\/usr\/bin\//,''), allow=ctx.h.sudoCmds||[];
   if(ctx.h.user!=='root'&&!allow.includes(c)&&!allow.includes('ALL')) return txt(`Sorry, user ${ctx.h.user} is not allowed to execute '/usr/bin/${c}' as root on ${ctx.h.host}.`,1);
   const r=R[c]; if(!r) return txt(`sudo: ${c}: command not found`,1);
   ctx.root=true; try{ const res=r.run(a.slice(1),ctx,si); ctx.ev('sudo',c+' '+a.slice(1).join(' ')); return res; } finally{ ctx.root=false; } });

// ---- blue: inspect + harden
cmd('ps','inspect','list running processes','ps — list processes.\n  ps aux   every process, every user, with its full command line\nLook for odd names, things running from /tmp, or a user like www-data running a shell.',
 (a,ctx)=>{ ctx.ev('ps'); return {o:'<b>USER       PID  %CPU COMMAND</b>\n'+ctx.st.procs.map(p=>`${p.u.padEnd(9)} ${String(p.pid).padStart(5)} ${String(p.cpu).padStart(5)} ${p.bad?'<span class="err">'+esc(p.c)+'</span>':esc(p.c)}`).join('\n'),h:1}; });
const listen=(a,ctx)=>{ ctx.ev('ss'); return {o:'<b>Netid State   Local Address:Port   Process</b>\n'+ctx.st.listen.map(l=>`tcp   LISTEN  0.0.0.0:${String(l.port).padEnd(13)}${l.bad?'<span class="err">'+esc(l.p)+'</span>':esc(l.p)}`).join('\n'),h:1}; };
cmd('ss','inspect','show listening ports','ss — socket statistics: which ports this machine is listening on.\n  ss -tulpn   tcp+udp, listening, with process names, numeric ports\nAn unexpected listener (4444, 1337, 31337...) often means a backdoor.',listen);
cmd('netstat','inspect','show listening ports (older)','netstat -tulpn — the older version of ss. Same idea: which ports are open, and which program owns each.',listen);
cmd('kill','harden','stop a process','kill — send a signal to a process by PID.\n  kill 1337      ask it to stop\n  kill -9 1337   force it\nKill malware only after you have recorded what it was (hash, path) — evidence first.',
 (a,ctx)=>{ const pid=+a.filter(x=>x[0]!=='-')[0]; const p=ctx.st.procs.find(x=>x.pid===pid); if(!p) return txt(`kill: (${a[a.length-1]}): No such process`,1);
   ctx.st.procs=ctx.st.procs.filter(x=>x!==p); ctx.st.listen=ctx.st.listen.filter(l=>l.pid!==pid); ctx.ev('kill',pid);
   return txt(p.respawn&&ctx.st.cronLive?`[${pid}] terminated  (watch out: something may start it again)`:`[${pid}] terminated`); });
cmd('rm','harden','delete a file','rm — remove files.\n  rm file        delete one file\n  rm -rf dir     delete a folder and everything in it (no undo!)\nUsed here to delete dropped malware and persistence.',
 (a,ctx)=>{ const tg=a.filter(x=>x[0]!=='-'); if(!tg.length) return txt('rm: missing operand',1); const rec=a.some(x=>/^-\w*r/.test(x)); const o=[];
   for(const f of tg){ const p=resolve(ctx,f); const n=node(ctx,p); if(!n){o.push(`rm: cannot remove '${f}': No such file or directory`);continue;}
     if(n.t==='d'&&!rec){o.push(`rm: cannot remove '${f}': Is a directory`);continue;}
     for(const k of Object.keys(ctx.h.fs)) if(k===p||k.startsWith(p+'/')) delete ctx.h.fs[k]; ctx.ev('rm',p); }
   return txt(o.join('\n'),o.length>0); });
cmd('chmod','harden','change permissions','chmod — change who can read (4), write (2) and execute (1) a file.\nThree digits: owner, group, everyone.\n  chmod 644 file   owner rw, others read-only\n  chmod 600 file   owner only\n  chmod o-w file   remove write for everyone else\nWorld-writable system files (666/777) are a gift to attackers.',
 (a,ctx)=>{ const [mode,f]=a; if(!f) return txt('usage: chmod MODE FILE',1); const p=resolve(ctx,f), n=node(ctx,p); if(!n) return txt(`chmod: cannot access '${f}': No such file or directory`,1);
   if(/^[0-7]{3,4}$/.test(mode)) n.m=mode.padStart(4,'0');
   else { const m=mode.match(/^([ugoa]*)([+-])([rwx]+)$/); if(!m) return txt(`chmod: invalid mode: '${mode}'`,1);
     let d=(n.m||'0644').padStart(4,'0').split('').map(Number); const who=m[1]||'a'; const bits=[...m[3]].reduce((s,c)=>s|({r:4,w:2,x:1})[c],0);
     const idx=[]; if(/[ua]/.test(who))idx.push(1); if(/[ga]/.test(who))idx.push(2); if(/[oa]/.test(who))idx.push(3);
     for(const i of idx) d[i]=m[2]==='+'?d[i]|bits:d[i]&~bits; n.m=d.join(''); }
   ctx.ev('chmod',p); return {}; });
cmd('crontab','inspect','scheduled jobs','crontab — scheduled tasks (cron jobs).\n  crontab -l   list this user’s jobs\n  crontab -r   remove them all\nSystem-wide jobs live in /etc/crontab and /etc/cron.d/. Malware loves cron for persistence (ATT&CK T1053.003).',
 (a,ctx)=>{ if(a.includes('-r')){ ctx.st.userCron=''; ctx.ev('cronr'); return txt(''); } return txt(ctx.st.userCron||`no crontab for ${ctx.h.user}`); });
cmd('ufw','harden','simple firewall','ufw — Uncomplicated Firewall.\n  ufw status\n  ufw default deny incoming   block everything inbound...\n  ufw allow 22                ...except what you need\n  ufw deny 4444\n  ufw enable\nDefault-deny plus a short allow list is the core of host hardening.',
 (a,ctx)=>{ const f=ctx.st.fw; const s=a.join(' ');
   if(!a.length||a[0]==='status'){ if(!f.on) return txt('Status: inactive'); return txt(`Status: active\nDefault: ${f.def} (incoming)\n\nTo          Action\n--          ------\n`+f.rules.map(r=>`${String(r.p).padEnd(12)}${r.a.toUpperCase()}`).join('\n')); }
   if(s==='enable'){ f.on=true; ctx.ev('ufw'); return txt('Firewall is active and enabled on system startup'); }
   if(s==='disable'){ f.on=false; return txt('Firewall stopped and disabled on system startup'); }
   if(/^default deny( incoming)?$/.test(s)){ f.def='deny'; ctx.ev('ufw'); return txt("Default incoming policy changed to 'deny'"); }
   const m=s.match(/^(allow|deny) (\d+)(\/tcp)?$/); if(m){ f.rules=f.rules.filter(r=>r.p!==+m[2]); f.rules.push({p:+m[2],a:m[1]}); ctx.ev('ufw'); return txt('Rule added'); }
   return txt('ERROR: Invalid syntax. Try: ufw status | ufw default deny incoming | ufw allow 22 | ufw enable',1); });
cmd('sha256sum','inspect','fingerprint a file','sha256sum — computes a file’s SHA-256 hash: a fingerprint that changes if a single byte changes.\nAnalysts share hashes as IOCs (indicators of compromise) and look them up in threat-intel feeds.',
 (a,ctx)=>{ const f=a[0]; if(!f) return txt('usage: sha256sum FILE',1); const p=resolve(ctx,f), n=node(ctx,p);
   if(!n||n.t!=='f') return txt(`sha256sum: ${f}: No such file or directory`,1); const h=n.hash||fakeHash(n.c); ctx.ev('hash',h); return txt(`${h}  ${f}`); });
cmd('strings','inspect','pull readable text from a binary','strings — prints the human-readable text buried in a binary file.\nThe fastest first look at malware: URLs, IPs, file paths, error messages and debug paths often leak out.',
 (a,ctx)=>{ const f=a[0]; if(!f) return txt('usage: strings FILE',1); const p=resolve(ctx,f), n=node(ctx,p); if(!n) return txt(`strings: '${f}': No such file`,1);
   ctx.ev('strings',p); return txt(n.strings||n.c); });

 (a,ctx)=>{ const q=a[0]; const r=q&&ctx.sc.ti.whois[q]; ctx.ev('whois',q); return r?txt(r):txt(`No match for "${q||''}".`); });
cmd('dig','intel','look up DNS records','dig — query DNS.\n  dig evil.example      which IP a domain points to\n  dig -x 203.0.113.7    reverse lookup\nPivoting between domains and IPs is how analysts map attacker infrastructure.',
 (a,ctx)=>{ const q=a.find(x=>x[0]!=='-'); const r=q&&ctx.sc.ti.dns[q]; ctx.ev('dig',q);

cmd('ti','intel','query the threat-intel database','ti — your team’s threat-intel platform (think VirusTotal + MISP).\n  ti lookup <hash|ip|domain>   what is known about an indicator\n  ti pivot <indicator>         related infrastructure\n  ti actors                    tracked threat groups\nAll actors and data in this simulation are fictional.',

cmd('attack','intel','MITRE ATT&CK reference','attack — look up a MITRE ATT&CK technique. ATT&CK is the shared vocabulary for attacker behaviour, organised by tactic (the goal) and technique (the how).\n  attack T1053.003\n  attack list',
 (a,ctx)=>{ const q=(a[0]||'').toUpperCase();
   if(!q||q==='LIST') return txt(Object.entries(ATTACK).map(([k,v])=>`${k.padEnd(10)} ${v.t.padEnd(21)} ${v.n}`).join('\n'));
   const v=ATTACK[q]; if(!v) return txt(`Unknown technique ${q}. Try: attack list`,1); ctx.ev('attack',q);

cmd('report','intel','build and file your case report','report — your case file.\n  report                    show it\n  report set <field> <value>\n  report submit\nFields: family, actor, c2, technique. A good report states what, who, how, and the evidence.',
 (a,ctx)=>{ const rp=ctx.st.report; const T=ctx.sc.truth;
   if(!a.length) return txt(Object.keys(T).map(k=>`${k.padEnd(10)} ${rp[k]||'—'}`).join('\n'));
   if(a[0]==='set'){ const f=a[1]; if(!T[f]) return txt(`Unknown field. Use: ${Object.keys(T).join(', ')}`,1); rp[f]=a.slice(2).join(' '); return txt(`${f} = ${rp[f]}`); }
   if(a[0]==='submit'){ const res=Object.keys(T).map(k=>[k,T[k].some(x=>(rp[k]||'').toLowerCase().includes(x))]);

  T.c=c;
  $('menu').classList.remove('on'); $('term').classList.add('on');
  const r=$('tRole'); r.textContent=sc.tag; r.className='tl '+sc.role; $('tName').textContent=sc.name;
  out().innerHTML='';
  line(`<span class="sys">┌─ ${esc(sc.tag)} · ${esc(sc.name)}</span>`,'',1);
  line(sc.brief,'out',1);
  line(`<span class="dim">Type <b>help</b> for commands, <b>man &lt;command&gt;</b> to learn one. ◎ shows your objectives and hints, ⌘ the command reference.</span>`,'',1);
  line(`\n<span class="info">▸ Objective 1: ${esc(sc.obj[0].t)}</span>`,'',1);
  renderChips(); renderMission(); renderCmds(); progress(); updPs1();
  setTimeout(()=>{ if(matchMedia('(pointer:fine)').matches) $('tInput').focus(); },50);
}
function close(){ $('term').classList.remove('on'); $('menu').classList.add('on'); drawer(null); T.c=null; }
function updPs1(){ if(T.c) $('tPs1').textContent=ps1(T.c); }

function tokenize(s){ const re=/"([^"]*)"|'([^']*)'|(\S+)/g; const t=[]; let m; while((m=re.exec(s))) t.push(m[1]!=null?m[1]:m[2]!=null?m[2]:m[3]); return t; }
function run(raw){
  const c=T.c; if(!c) return; const s=raw.trim();
  line(`<span class="p">${esc(ps1(c))}</span> ${esc(s)}`,'cmd',1);
  if(!s){ scroll(); return; }
  c.hist.push(s); c.hi=c.hist.length;
  let stdin=null, res=null;
  const stages=s.split('|').map(x=>x.trim());
  for(let i=0;i<stages.length;i++){
    const [name,...args]=tokenize(stages[i]); if(!name) break;
    if(!R[name]||!c.sc.cmds.includes(name)){ line(`${name}: command not found${R[name]?' (not available in this mission)':''}  — type help`,'err'); res=null; break; }
    try{ res=R[name].run(args,c,stdin)||{}; }catch(e){ res={o:`${name}: ${e.message}`,e:1}; }
    if(res.clear){ out().innerHTML=''; res=null; break; }
    if(res.e){ line(res.o,'err',res.h); res=null; break; }
    stdin=res.o!=null?(res.h?res.o.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&'):res.o):'';
  }
  if(res&&res.o) line(res.o,'out',res.h);
  updPs1(); check(); scroll();
}
function check(){
  const c=T.c; if(!c||c.finished) return; const sc=c.sc;
  sc.obj.forEach((o,i)=>{ if(!c.done.has(i)&&o.ok(c)){ c.done.add(i);
    line(`<span class="ok">✔ Objective complete: ${esc(o.t)}</span>`,'',1);
    const nx=sc.obj.findIndex((_,j)=>!c.done.has(j)); if(nx>=0) line(`<span class="info">▸ Next: ${esc(sc.obj[nx].t)}</span>`,'',1); } });
  progress(); renderMission();
  if(c.done.size===sc.obj.length){ c.finished=true; finish(); }
}
function progress(){ const c=T.c; const n=c.done.size, t=c.sc.obj.length; $('tProgBar').style.width=(n/t*100)+'%'; $('tProgTxt').textContent=`${n}/${t} objectives`; }
function finish(){
  const c=T.c; const sc=c.sc;
  const other=Object.keys(SCEN).filter(k=>k!==sc.role);
  line(`\n<span class="sys">══════════════════════════════════</span>\n<span class="ok"><b>MISSION COMPLETE</b> · ${esc(sc.name)}</span>\nCommands typed: ${c.hist.length}\n<span class="sys">══════════════════════════════════</span>`,'',1);
  const d=document.createElement('div'); d.className='block'; d.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px';
  d.innerHTML=`<button class="btn pri sm" data-go="${sc.role}">Replay</button>`+other.map(k=>`<button class="btn sm" data-go="${k}">Try ${esc(SCEN[k].tag.toLowerCase())}</button>`).join('')+`<button class="btn ghost sm" data-go="menu">Menu</button>`;
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>b.dataset.go==='menu'?close():open(b.dataset.go));
  out().appendChild(d); scroll();
}

/* ---------- drawers + chips ---------- */
function drawer(id){ ['cmdDrawer','missionDrawer'].forEach(x=>$(x).classList.toggle('on',x===id&&!$(x).classList.contains('on'))); }
function renderMission(){
  const c=T.c; if(!c) return; const sc=c.sc;
  $('missionDrawer').innerHTML=`<div class="dh"><h3>Mission</h3><button data-x>✕</button></div><div class="brief-box">${sc.brief}</div>`+
   sc.obj.map((o,i)=>`<div class="obj-row ${c.done.has(i)?'done':''}"><div class="bx">${c.done.has(i)?'✓':i+1}</div><div class="ot"><b>${esc(o.t)}</b>
     ${c.done.has(i)?'':`<button class="hintbtn" data-h="${i}">show hint</button><div class="hint" id="hint${i}" hidden>${esc(o.h)}</div>`}</div></div>`).join('');
  $('missionDrawer').querySelector('[data-x]').onclick=()=>drawer(null);
  $('missionDrawer').querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ $('hint'+b.dataset.h).hidden=false; b.remove(); });
}
function renderCmds(){
  const c=T.c; if(!c) return; const by={};
  for(const n of c.sc.cmds){ const r=R[n]; (by[r.g]=by[r.g]||[]).push(n); }
  $('cmdDrawer').innerHTML=`<div class="dh"><h3>Command reference</h3><button data-x>✕</button></div><p style="font-size:12px;color:var(--dim);margin:0 0 14px">Tap any command to read its lesson in the terminal.</p>`+
   Object.entries(by).map(([g,l])=>`<div class="cmdgrp"><div class="gt">${esc(g)}</div>${l.map(n=>`<div class="cmd-row" data-m="${n}"><code>${n}</code><span>${esc(R[n].s)}</span></div>`).join('')}</div>`).join('');
  $('cmdDrawer').querySelector('[data-x]').onclick=()=>drawer(null);
  $('cmdDrawer').querySelectorAll('[data-m]').forEach(r=>r.onclick=()=>{ drawer(null); run('man '+r.dataset.m); });
}
function renderChips(){
  const c=T.c; $('termchips').innerHTML=c.sc.chips.map(x=>`<button class="chip-c" type="button">${esc(x)}</button>`).join('');
  $('termchips').querySelectorAll('button').forEach(b=>b.onclick=()=>{ const i=$('tInput'); i.value=b.textContent; i.focus(); });
}

/* ---------- input ---------- */
$('tForm').addEventListener('submit',e=>{ e.preventDefault(); const i=$('tInput'); const v=i.value; i.value=''; run(v); });
$('tInput').addEventListener('keydown',e=>{ const c=T.c; if(!c) return; const i=e.target;
  if(e.key==='ArrowUp'){ if(c.hi>0){ c.hi--; i.value=c.hist[c.hi]; } e.preventDefault(); }
  else if(e.key==='ArrowDown'){ if(c.hi<c.hist.length){ c.hi++; i.value=c.hist[c.hi]||''; } e.preventDefault(); }
  else if(e.key==='Tab'){ e.preventDefault(); const parts=i.value.split(' '); const last=parts.pop();
    let opts=[]; if(!parts.length) opts=c.sc.cmds.filter(n=>n.startsWith(last));
    else { const dir=last.includes('/')?last.slice(0,last.lastIndexOf('/')+1):''; const p=resolve(c,dir||'.');
      opts=kids(c,p).map(k=>dir+base(k)+(c.h.fs[k].t==='d'?'/':'')).filter(x=>x.startsWith(last)); }
    if(opts.length===1) i.value=[...parts,opts[0]].join(' ')+(opts[0].endsWith('/')?'':' ');
    else if(opts.length>1) line(opts.join('  '),'dim'), scroll(); }
  else if(e.key==='l'&&e.ctrlKey){ e.preventDefault(); out().innerHTML=''; } });
$('tBack').onclick=close;
$('tMission').onclick=()=>drawer('missionDrawer');
$('tCmds').onclick=()=>drawer('cmdDrawer');
$('termout').addEventListener('click',()=>{ if(!getSelection().toString()&&matchMedia('(pointer:fine)').matches) $('tInput').focus(); });

/* ---------- menu cards ---------- */
const box=$('trainModes');
for(const [id,sc] of Object.entries(SCEN)){
  const b=document.createElement('button'); b.className='mode '+({red:'hot',blue:'co',intel:'ad'})[sc.role];
  b.innerHTML=`<div class="mt"><span class="ic">${sc.ic}</span>${esc(sc.name)}</div><div class="pl">${esc(sc.tag)} · ${sc.obj.length} objectives</div><p>${esc(sc.card)}</p>`;
  b.onclick=()=>open(id); box.appendChild(b);
}
window.RKTerm={open,run};
})();
</script>
