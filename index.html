<meta name="claude:viewport-fit-sides" content="cover">
<title>Rootkit</title>
<style>
/* Layout: a dark operations console — status rail on top, a tappable network
   map in the middle, a context action sheet at the bottom. Committed single
   dark theme (a hacker terminal), every color set explicitly. */
:root{
  color-scheme: dark;
  --bg:#070b12; --panel:#0d141f; --panel2:#111b29; --line:#1d2a3d;
  --fg:#d7e3f2; --dim:#7c8ca3; --faint:#53607a;
  --acc:#39e0a6;      /* attacker / you */
  --acc2:#2bb4ff;     /* info / scan */
  --warn:#ffd23f;     /* trace / caution */
  --bad:#ff5d6c;      /* alarm / defender */
  --good:#39e0a6;
  --root:#b98bff;     /* root access / core */
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:
    radial-gradient(1200px 600px at 80% -10%, rgba(43,180,255,.08), transparent 60%),
    radial-gradient(900px 500px at 0% 110%, rgba(57,224,166,.07), transparent 55%);
}
button{font-family:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:860px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));
  padding-block:22px}

/* ---------- menu ---------- */
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:8px}
.brand h1{font-size:clamp(34px,9vw,58px);margin:0;letter-spacing:-1px;font-weight:700;
  background:linear-gradient(100deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .cur{color:var(--acc);animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.tag{color:var(--dim);font-family:var(--mono);font-size:13px;margin:6px 0 20px}
.tag b{color:var(--acc)}
.sub{color:var(--faint);font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:2px;margin:26px 0 10px}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{display:flex;flex-direction:column;gap:7px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:16px 16px 15px;transition:.14s;position:relative;overflow:hidden}
.mode:hover,.mode:focus-visible{border-color:var(--acc);outline:none;transform:translateY(-2px)}
.mode .mt{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.mode .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);
  font-weight:700;font-size:13px;flex:none;background:var(--panel2);border:1px solid var(--line)}
.mode p{margin:0;color:var(--dim);font-size:13px;line-height:1.45}
.mode .pl{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:1px;text-transform:uppercase}
.mode.hot .ic{color:var(--acc);border-color:var(--acc)}
.mode.vs .ic{color:var(--bad);border-color:var(--bad)}
.mode.co .ic{color:var(--acc2);border-color:var(--acc2)}
.mode.ad .ic{color:var(--warn);border-color:var(--warn)}

.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);
  border-radius:11px;padding:12px 16px;font-size:14px;font-weight:600;transition:.13s}
.btn:hover{border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(100deg,var(--acc),#20c48c);color:#042017;border:none}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* co-op panel */
.coop{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-top:14px}
.coop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.coop-h b{font-size:15px}
.coop-h span{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;align-items:center;gap:7px}
.coop p{margin:4px 0 12px;color:var(--dim);font-size:13px;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.live{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.code{font-family:var(--mono);font-size:30px;letter-spacing:8px;color:var(--acc);font-weight:700;
  background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;text-align:center;margin:8px 0}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font-family:var(--mono);font-size:20px;letter-spacing:6px;text-transform:uppercase;
  text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px;outline:none}
.field input:focus{border-color:var(--acc)}
.open-sq{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.sq-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px}
.sq-row .c{font-family:var(--mono);letter-spacing:3px;color:var(--acc)}

/* ---------- in-game ---------- */
#game{display:none;position:absolute;inset:0;flex-direction:column}
#game.on{display:flex}
.topbar{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);background:rgba(8,13,20,.86);backdrop-filter:blur(6px);
  padding-top:max(8px,env(safe-area-inset-top,0px))}
.topbar .iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
  display:grid;place-items:center;font-size:16px;flex:none}
.obj{flex:1;min-width:0}
.obj .ol{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--faint);text-transform:uppercase}
.obj .objv{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--mono);font-weight:700;font-size:16px;flex:none;color:var(--fg)}
.clock.warn{color:var(--warn)} .clock.bad{color:var(--bad);animation:blink 1s step-end infinite}

.meters{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.meter{flex:1;min-width:0}
.meter .ml{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:4px;letter-spacing:.5px}
.meter .ml b{color:var(--fg)}
.bar{height:7px;border-radius:5px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;transition:width .3s ease}
.bar.trace>i{background:linear-gradient(90deg,var(--acc2),var(--warn) 65%,var(--bad))}
.bar.prog>i{background:linear-gradient(90deg,var(--acc),var(--root))}

/* board / map */
.boardwrap{flex:1;position:relative;overflow:hidden}
.boardtabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--panel)}
.boardtabs button{flex:1;padding:9px;background:transparent;border:none;border-bottom:2px solid transparent;
  font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:1px}
.boardtabs button.sel{color:var(--fg);border-bottom-color:var(--acc)}
.boardtabs button.def.sel{border-bottom-color:var(--bad)}
.map{position:absolute;inset:0}
.links{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;
  width:92px;text-align:center}
.node .chip{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);
  display:grid;place-items:center;font-size:20px;transition:.15s;position:relative}
.node .nm{font-size:11px;font-family:var(--mono);color:var(--dim);line-height:1.1;max-width:90px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .sub{font-size:9px;color:var(--faint);font-family:var(--mono);margin:0}
.node.undisc{opacity:.32;filter:grayscale(.6)}
.node.undisc .nm{color:var(--faint)}
.node.sel .chip{border-color:var(--acc);box-shadow:0 0 0 3px rgba(57,224,166,.2),0 0 18px rgba(57,224,166,.3)}
.node.foot .chip{border-color:var(--acc);color:var(--acc)}
.node.root .chip{border-color:var(--root);color:var(--root);box-shadow:0 0 14px rgba(185,139,255,.35)}
.node.core .chip{border-style:double;border-width:3px}
.node.alarm .chip{animation:alarm .6s ease}
@keyframes alarm{0%,100%{box-shadow:0 0 0 0 rgba(255,93,108,0)}50%{box-shadow:0 0 0 5px rgba(255,93,108,.5)}}
.node .ring{position:absolute;inset:-6px;border-radius:17px;border:2px solid transparent}
.node.busy .ring{border-color:var(--warn);border-top-color:transparent;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.node .fw{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#2a0007;font-family:var(--mono);
  font-size:9px;font-weight:700;border-radius:6px;padding:1px 4px;line-height:1.3}
.node .hp{position:absolute;bottom:-6px;left:-6px;font-size:12px}
.badge-you{position:absolute;bottom:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:var(--acc);
  border:2px solid var(--bg);font-size:0}
.badge-mate{background:var(--acc2)}

/* action sheet */
.sheet{border-top:1px solid var(--line);background:var(--panel);
  padding:12px max(14px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px))}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.sheet .sh .chip2{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  display:grid;place-items:center;font-size:18px;flex:none}
.sheet .sh .ti{flex:1;min-width:0}
.sheet .sh .ti b{display:block;font-size:15px}
.sheet .sh .ti span{font-family:var(--mono);font-size:11px;color:var(--dim)}
.acc-state{font-family:var(--mono);font-size:10px;padding:3px 7px;border-radius:6px;border:1px solid var(--line);color:var(--dim);flex:none}
.acc-state.foot{color:var(--acc);border-color:var(--acc)} .acc-state.root{color:var(--root);border-color:var(--root)}
.svc{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;padding:5px 0;color:var(--dim)}
.svc .pt{color:var(--faint)} .svc .vn{color:var(--bad)} .svc .pa{color:var(--good)} .svc .lk{color:var(--warn)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:4px}
.act{display:flex;flex-direction:column;gap:2px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;text-align:left}
.act:hover:not(:disabled){border-color:var(--acc)}
.act:disabled{opacity:.38}
.act b{font-size:13px}
.act span{font-family:var(--mono);font-size:10px;color:var(--faint)}
.act.danger:hover:not(:disabled){border-color:var(--bad)}
.act.def{} .act.def:hover:not(:disabled){border-color:var(--bad)}
.hint-empty{color:var(--dim);font-size:13px;text-align:center;padding:10px;font-family:var(--mono)}

/* log feed */
.feed{position:absolute;left:0;right:0;bottom:0;max-height:38%;pointer-events:none;
  display:flex;flex-direction:column-reverse;gap:4px;padding:0 14px 8px;overflow:hidden}
.ln{font-family:var(--mono);font-size:11.5px;background:rgba(8,13,20,.7);border-left:2px solid var(--line);
  padding:3px 8px;border-radius:0 6px 6px 0;color:var(--dim);max-width:460px;animation:lnin .2s}
.ln.you{border-left-color:var(--acc);color:var(--fg)} .ln.mate{border-left-color:var(--acc2)}
.ln.def{border-left-color:var(--bad);color:#ffc3c9} .ln.sys{border-left-color:var(--warn);color:#ffe9a6}
@keyframes lnin{from{opacity:0;transform:translateX(-8px)}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--acc);color:var(--fg);font-family:var(--mono);font-size:13px;
  padding:9px 15px;border-radius:10px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1}

/* overlays */
.ov{position:absolute;inset:0;z-index:50;background:rgba(5,8,13,.9);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:18px;padding-top:max(18px,env(safe-area-inset-top,0px))}
.ov.on{display:flex}
.card{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:22px;max-height:88%;overflow-y:auto}
.card h2{margin:0 0 4px;font-size:22px} .card h2.win{color:var(--acc)} .card h2.lose{color:var(--bad)}
.card .big{font-family:var(--mono);font-size:13px;color:var(--dim);margin-bottom:16px}
.prim-sec{margin:14px 0}
.prim-sec h3{font-size:14px;margin:0 0 5px;color:var(--acc);font-family:var(--mono);letter-spacing:.5px}
.prim-sec p{margin:0;color:var(--dim);font-size:13.5px;line-height:1.55}
.kv{display:flex;gap:9px;font-size:13px;margin:3px 0;color:var(--dim);font-family:var(--mono)}
.kv b{color:var(--fg);min-width:92px;flex:none}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 16px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--mono);font-size:22px;font-weight:700} .stat .k{font-size:11px;color:var(--dim)}
.card .row{margin-top:8px}
</style>

<div id="app">

  <!-- ================= MENU ================= -->
  <section id="menu" class="screen on scroll">
    <div class="wrap">
      <div class="brand"><h1>rootkit<span class="cur">_</span></h1></div>
      <div class="tag">a hacking game you can actually follow — <b>scan</b>, <b>exploit</b>, <b>crack</b>, go for <b>root</b>.</div>

      <div class="sub">Play solo</div>
      <div class="modes" id="soloModes"></div>

      <div class="sub">Play with a friend</div>
      <div id="coop" class="coop"></div>

      <div class="row" style="margin-top:22px">
        <button class="btn ghost sm" id="primerBtn">New here? Read the 60-second primer</button>
      </div>
      <div style="height:30px"></div>
    </div>
  </section>

  <!-- ================= GAME ================= -->
  <div id="game">
    <div class="topbar">
      <button class="iconbtn" id="backBtn" title="Leave">‹</button>

  <!-- overlays -->
  <div class="ov" id="endOv"><div class="card" id="endCard"></div></div>

</div>

<script>
"use strict";
(function(){
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const now=()=>performance.now();

/* =========================================================================
   AUDIO — tiny blips
   ========================================================================= */
let AC=null;
function audio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function beep(f,d,type,g){ if(!AC)return; try{
  const o=AC.createOscillator(),v=AC.createGain(); o.type=type||'sine'; o.frequency.value=f;
  v.gain.value=0; o.connect(v); v.connect(AC.destination); const t=AC.currentTime;
  v.gain.linearRampToValueAtTime(g||.05,t+.01); v.gain.exponentialRampToValueAtTime(.0001,t+(d||.12));
  o.start(t); o.stop(t+(d||.12)+.02);
}catch(e){} }
const sfx={
  tap:()=>beep(520,.05,'square',.03), sel:()=>beep(680,.06,'sine',.035),
  scan:()=>{beep(880,.05,'sine',.03);setTimeout(()=>beep(1180,.06,'sine',.03),60);},
  go:()=>beep(440,.08,'sawtooth',.03), done:()=>{beep(660,.07,'sine',.04);setTimeout(()=>beep(990,.09,'sine',.04),70);},
  root:()=>{beep(330,.1,'sawtooth',.05);setTimeout(()=>beep(495,.1,'sawtooth',.05),90);setTimeout(()=>beep(660,.16,'sawtooth',.05),180);},
  alarm:()=>{beep(220,.12,'square',.05);setTimeout(()=>beep(180,.16,'square',.05),110);},
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.14,'sine',.05),i*110));},
  lose:()=>{[440,330,247,196].forEach((f,i)=>setTimeout(()=>beep(f,.18,'sine',.05),i*130));},
  bad:()=>beep(160,.15,'square',.05),
};

/* =========================================================================
   SERVICE + NETWORK DEFINITIONS
   Networks are static templates shared by id, so host and guest build the
   identical board. Only live state (access, trace, timers) travels.
   ========================================================================= */
// kind: 'vuln' = has a flaw you can exploit; 'login' = needs a password (crack,
// faster with stolen creds); 'plain' = nothing exploitable here.
const SVC={
  web:  {label:'web server', port:80,  icon:'🌐'},
  ssh:  {label:'remote login',port:22,  icon:'🔑'},
  ftp:  {label:'file share',  port:21,  icon:'📁'},
  smb:  {label:'file share',  port:445, icon:'📂'},
  db:   {label:'database',    port:5432,icon:'🗄️'},
  rdp:  {label:'desktop',     port:3389,icon:'🖥️'},
  api:  {label:'app server',  port:8080,icon:'⚙️'},
  mail: {label:'mail server', port:25,  icon:'✉️'},
};
// Node types -> icon
const TYPE_ICON={edge:'🌍',relay:'🖧',host:'💻',db:'🗄️',core:'🏦'};

// Build a service instance: {k:serviceKey, kind, patched:false}
function svc(k,kind){ return {k,kind,patched:false}; }

/* Level templates. Coords in 0..100 board space. links by node id.
   One node is type:'edge' (your way in), one is {core:true} (the goal). */
const LEVELS={
  tutorial:{
    name:'Training Range', diff:0,
    brief:'A tiny two-machine network. Scan the web server, exploit it, get root, and read the vault. Nobody is watching — take your time.',
    nodes:[
      {id:'web',name:'web-01',type:'edge',x:26,y:50,svc:[svc('web','vuln')],links:['vault'],loot:{creds:true}},
      {id:'vault',name:'vault',type:'core',core:true,x:74,y:50,svc:[svc('ssh','login')],links:['web']},
    ],
  },
  office:{
    name:'Acme Corp', diff:1,
    brief:'A small office network. The web server faces the internet; the file server holds a login you can crack once you steal credentials; the records database is the prize.',
    nodes:[
      {id:'web',name:'web-01',type:'edge',x:16,y:34,svc:[svc('web','vuln'),svc('ssh','login')],links:['file','app']},
      {id:'app',name:'app-02',type:'host',x:20,y:72,svc:[svc('api','vuln')],links:['web','file'],loot:{creds:true}},
      {id:'file',name:'files',type:'host',x:52,y:50,svc:[svc('smb','vuln'),svc('ftp','login')],links:['web','app','db'],loot:{intel:true}},
      {id:'db',name:'records',type:'core',core:true,x:85,y:50,svc:[svc('db','login')],links:['file']},
    ],
  },
  bank:{
    name:'Meridian Bank', diff:2,
    brief:'A hardened network with a jump box between you and the vault. Plan your route: steal creds from the mail server, pivot through the relay, then crack the core. Expect pushback.',
    nodes:[
      {id:'edge',name:'gateway',type:'edge',x:12,y:50,svc:[svc('web','vuln'),svc('ssh','login')],links:['mail','relay']},
      {id:'mail',name:'mail-01',type:'host',x:33,y:22,svc:[svc('mail','vuln')],links:['edge','relay'],loot:{creds:true}},

/* =========================================================================
   BOARD STATE
   A Board = one network with live state, a trace meter, attackers and a
   defender (ai | human | off). The owner is whoever defends it.
   ========================================================================= */
const OP={   // attacker operations: cost in trace, base seconds
  scan:    {label:'Scan',      verb:'scanning',    sec:1.6, trace:3,  icon:'📡', desc:'reveal services + neighbours'},
  exploit: {label:'Exploit',   verb:'exploiting',  sec:3.2, trace:12, icon:'💥', desc:'break a vulnerable service'},
  crack:   {label:'Crack',     verb:'cracking',    sec:7,   trace:20, icon:'🔓', desc:'brute-force a login'},
  escalate:{label:'Escalate',  verb:'escalating',  sec:4,   trace:16, icon:'⬆️', desc:'user → root'},
  harvest: {label:'Harvest',   verb:'harvesting',  sec:2.4, trace:8,  icon:'🧲', desc:'steal creds / intel'},
  cover:   {label:'Cover tracks',verb:'wiping logs',sec:5,  trace:-34,icon:'🧹', desc:'lower your trace'},
};
const DEF={  // defender actions: cost in ops points
  patch:   {label:'Patch',    cost:2, icon:'🩹', desc:'remove a vulnerability'},
  firewall:{label:'Firewall', cost:2, icon:'🧱', desc:'slow attacks on this node'},
  restore: {label:'Restore',  cost:4, icon:'♻️', desc:'reset a breached node'},
  honeypot:{label:'Honeypot', cost:3, icon:'🍯', desc:'trap: spikes attacker trace'},
};

function makeBoard(levelId, owner){
  const L=LEVELS[levelId];
  const dyn={};
  for(const n of L.nodes){
    dyn[n.id]={
      disc: n.type==='edge', scanned:false, access:0, // 0 none,1 foothold,2 root
      fw:0, honey:false, looted:false,
      svc: n.svc.map(s=>({patched:false})),
    };
  }
  return {
    lvl:levelId, owner, dyn, trace:0, maxTrace:100, kicks:0,
    defKind:'off', defOps:4, defMax:8, defCd:0, lastDef:0,
    alarm:{}, // nodeId -> expiry (visual)
    done:false,
  };
}
function L(board){ return LEVELS[board.lvl]; }
function node(board,id){ return L(board).nodes.find(n=>n.id===id); }
function neighbors(board,id){ return node(board,id).links; }

// reachable to attack: discovered AND (edge OR a linked node you have foothold+ on)
function reachable(board,id){
  const n=node(board,id), d=board.dyn[id];
  if(!d.disc) return false;
  if(n.type==='edge') return true;
  return n.links.some(l=>board.dyn[l] && board.dyn[l].access>=1);
}

/* =========================================================================
   MATCH — ties boards + attacker(s) together for the current mode
   ========================================================================= */
// modes: sandbox, ai, coop (vs ai), defend (human v human, 1 board), duel (2 boards)
const G={
  mode:null, boards:[], atk:{}, // atk[pid] = {creds:Set,intel:0,op:null,homeBoard,atkBoard}
  me:'host', role:'atk', shownBoard:0, timeLeft:0, t0:0, running:false,
  selNode:null, log:[], difficulty:1,
};

function myAtk(){ return G.atk[G.me]; }
// the board the local player is currently attacking
function atkBoardOf(pid){ return G.boards[G.atk[pid].atkBoard]; }
// the board the local player defends (owns)
function defBoardOf(pid){ return G.boards[G.atk[pid].homeBoard]; }

function addLog(kind,msg){ G.log.push({kind,msg,t:Date.now()}); if(G.log.length>40)G.log.shift(); renderFeed(); }

/* ---------- starting a match ---------- */
function startMatch(mode,opts){
  opts=opts||{};
  audio();
  G.mode=mode; G.boards=[]; G.atk={}; G.selNode=null; G.log=[]; G.running=true; G.t0=now();
  G.difficulty=opts.difficulty||1;
  G.me = NET.mode==='guest' ? 'guest' : 'host';

  if(mode==='duel'){
    // two boards; host defends board0 & attacks board1, guest the mirror
    G.boards=[makeBoard('duel','host'), makeBoard('duel','guest')];
    G.boards[0].defKind='human'; G.boards[1].defKind='human';
    G.atk.host={creds:new Set(),intel:0,op:null,homeBoard:0,atkBoard:1,kicks:0};
    G.atk.guest={creds:new Set(),intel:0,op:null,homeBoard:1,atkBoard:0,kicks:0};
    G.timeLeft=opts.time||300;
    G.shownBoard = G.me==='guest'?0:1; // show the board you attack
  } else if(mode==='defend'){
    // one board: attacker vs defender (human each)
    const lv=opts.level||'office';
    G.boards=[makeBoard(lv, 'defender')];
    G.boards[0].defKind='human';
    // host = attacker by default (chosen in lobby via opts.role)
    const atkPid = opts.atkPid||'host';
    G.atk[atkPid]={creds:new Set(),intel:0,op:null,homeBoard:-1,atkBoard:0,kicks:0};
    G.defenderPid = atkPid==='host'?'guest':'host';
    G.timeLeft=opts.time||300;
    G.shownBoard=0;
  } else if(mode==='coop'){
    const lv=opts.level||'bank';
    G.boards=[makeBoard(lv,'ai')];
    G.boards[0].defKind = opts.defenderOn===false?'off':'ai';
    G.atk.host={creds:new Set(),intel:0,op:null,homeBoard:-1,atkBoard:0,kicks:0};
    G.atk.guest={creds:new Set(),intel:0,op:null,homeBoard:-1,atkBoard:0,kicks:0};
    G.timeLeft=opts.time||0; // co-op: no hard clock, but 3 full-trace lockouts = fail
    G.shownBoard=0;
  } else { // sandbox / ai (solo)
    const lv=opts.level||'office';
    G.boards=[makeBoard(lv, mode==='ai'?'ai':'off')];
    G.boards[0].defKind = mode==='ai'?'ai':'off';
    G.atk.host={creds:new Set(),intel:0,op:null,homeBoard:-1,atkBoard:0,kicks:0};
    G.timeLeft = mode==='ai'?(opts.time||360):0;
    G.shownBoard=0;
  }
  G.coopFails=0;

  showGame();
  // auto-select the entry node you attack
  const b=atkBoardOf(G.me);
  const entry=L(b).nodes.find(n=>n.type==='edge');
  selectNode(entry.id);
  addLog('sys', modeIntro());
  if(NET.mode!=='solo') NET.send(true);
}
function modeIntro(){
  switch(G.mode){
    case 'sandbox':return 'Sandbox — no defender. Learn the ropes.';
    case 'ai':return 'Target acquired. Reach root on the core before the clock runs out.';
    case 'coop':return 'Co-op breach. Split the work — one of you takes the left branch.';
    case 'defend':return G.role==='def'?'You are defending. Patch holes and slow the attacker.':'Breach the server before the defender locks you out.';
    case 'duel':return 'Duel. First to root your rival\'s core wins. Defend your own side too.';
  }
  return '';
}

/* =========================================================================
   ATTACKER ACTIONS  (run by the board's host; guests send requests)
   ========================================================================= */
function fwMul(board,id){ return 1 + 0.6*board.dyn[id].fw; }  // firewall slows ops

function canDo(pid,kind,nodeId,si){
  const b=atkBoardOf(pid), d=b.dyn[nodeId], n=node(b,nodeId), a=G.atk[pid];
  if(a.op) return false;
  if(b.done) return false;
  switch(kind){
    case 'scan': return reachable(b,nodeId) && !d.scanned;
    case 'exploit':{ if(!d.scanned||d.access>=1) return false; const s=n.svc[si],st=d.svc[si];
      return s&&s.kind==='vuln'&&!st.patched; }
    case 'crack':{ if(!d.scanned||d.access>=1) return false; const s=n.svc[si];
      return s&&s.kind==='login'; }
    case 'escalate': return d.access===1;
    case 'harvest': return d.access>=2 && n.loot && !d.looted;
    case 'cover': return b.trace>5;
  }
  return false;
}

function beginOp(pid,kind,nodeId,si){
  if(!canDo(pid,kind,nodeId,si)) return false;
  const b=atkBoardOf(pid), a=G.atk[pid];
  let sec=OP[kind].sec;
  if(kind==='crack'){
    // creds you already stole on this board make cracks much faster
    const have=a.creds.has(b.owner+':'+nodeId) || a.creds.has(b.owner+':*');
    sec = have? sec*0.35 : sec;
  }
  sec *= (kind==='scan'||kind==='cover')?1:fwMul(b,nodeId);
  sec *= (G.mode==='ai'||G.mode==='coop')? (1 - (G.difficulty-1)*0.0) : 1;
  a.op={kind,nodeId,si:si==null?-1:si,t:0,dur:sec,board:a.atkBoard};
  if(pid===G.me){ sfx[kind==='scan'?'scan':'go'](); }
  return true;
}

function finishOp(pid){
  const a=G.atk[pid], op=a.op; if(!op) return;
  const b=G.boards[op.board], d=b.dyn[op.nodeId], n=node(b,op.nodeId);
  const mine = pid===G.me;
  const who = mine?'you':(pid==='host'?'mate':'mate');
  a.op=null;
  const addTrace=v=>{ b.trace=clamp(b.trace+v,0,b.maxTrace); if(v>0) maybeAlarm(b,op.nodeId); };

  switch(op.kind){
    case 'scan':{
      d.scanned=true; d.disc=true;
      for(const l of n.links) b.dyn[l].disc=true;
      addTrace(OP.scan.trace);
      if(mine){ sfx.done(); addLog('you',`scan ${n.name}: ${n.svc.length} service(s), ${n.links.length} link(s) found`); }
      else addLog('mate',`${who} scanned ${n.name}`);
      break;
    }
    case 'exploit':{
      d.access=Math.max(d.access,1); addTrace(OP.exploit.trace);
      if(d.honey){ addTrace(40); b.kicks++; if(mine){sfx.alarm();addLog('sys','⚠ that was a honeypot! trace spiked')} }
      if(mine){ sfx.done(); addLog('you',`foothold on ${n.name} via ${SVC[n.svc[op.si].k].label}`); }
      else addLog('mate',`${who} got a foothold on ${n.name}`);
      break;
    }
    case 'crack':{
      d.access=Math.max(d.access,1); addTrace(OP.crack.trace);
      if(mine){ sfx.done(); addLog('you',`cracked ${SVC[n.svc[op.si].k].label} on ${n.name}`); }
      else addLog('mate',`${who} cracked into ${n.name}`);
      break;
    }
    case 'escalate':{
      d.access=2; addTrace(OP.escalate.trace);
      for(const l of n.links) b.dyn[l].disc=true;
      if(n.core){ ownCore(pid,b); return; }
      if(mine){ sfx.root(); addLog('you',`ROOT on ${n.name} — neighbours revealed`); }
      else addLog('mate',`${who} rooted ${n.name}`);
      break;
    }
    case 'harvest':{
      d.looted=true; addTrace(OP.harvest.trace);
      if(n.loot.creds){ a.creds.add(b.owner+':*'); if(mine)addLog('you',`stole credentials — logins crack faster now`); }
      if(n.loot.intel){ a.intel++; for(const nn of L(b).nodes) b.dyn[nn.id].scanned = b.dyn[nn.id].scanned; // intel reveals vuln hints (handled in UI by disc)
        for(const nn of L(b).nodes) if(b.dyn[nn.id].disc) b.dyn[nn.id].scanned=true;
        if(mine)addLog('you',`grabbed intel — vulnerabilities mapped across the network`); }
      if(!mine) addLog('mate',`${who} harvested ${n.name}`);
      break;
    }
    case 'cover':{
      addTrace(OP.cover.trace);
      if(mine){ sfx.done(); addLog('you',`wiped logs — trace down to ${Math.round(b.trace)}%`); }
      else addLog('mate',`${who} wiped their tracks`);
      break;
    }
  }
  checkTrace(b);
  uiRefresh();
  pushState();
}
function uiRefresh(){ if($('game').classList.contains('on')){ buildNodes(); buildSheet(); renderMeters(); } }

function ownCore(pid,b){
  b.done=true; b.winner=pid;
  if(pid===G.me){ sfx.win(); }
  endMatch(pid);
}

function maybeAlarm(b,nodeId){ b.alarm[nodeId]=now()+600; }

// trace hitting the cap: lockout. Resets your deepest foothold, bumps kicks.
function checkTrace(b){
  if(b.trace < b.maxTrace) return;
  b.trace = 55; b.kicks++;
  // find the attacker-held node closest to core (roughly: deepest non-edge)
  let worst=null;
  for(const n of L(b).nodes){ const d=b.dyn[n.id];
    if(d.access>=1 && n.type!=='edge'){ if(!worst||d.access>b.dyn[worst].access) worst=n.id; } }
  if(worst){ b.dyn[worst].access=0; b.alarm[worst]=now()+900; }
  for(const pid in G.atk){ if(atkBoardOf(pid)===b && G.atk[pid].op && G.atk[pid].op.board===G.boards.indexOf(b)) G.atk[pid].op=null; }
  const mine = atkBoardOf(G.me)===b;
  if(mine) sfx.alarm();
  addLog(mine?'sys':'def', mine?`⚠ INTRUSION DETECTED — you were kicked from ${worst||'the network'} (${b.kicks}/3)`:`defence repelled an intruder`);
  if(G.mode==='coop' && b.kicks>=3){ b.done=true; endMatch(null,'coop-fail'); }
  if((G.mode==='defend') && b.kicks>=3){ b.done=true; endMatch(G.defenderPid,'defended'); }
}

/* =========================================================================
   DEFENDER ACTIONS
   ========================================================================= */
function defCanDo(b,kind,nodeId,si){
  if(b.defOps<DEF[kind].cost||b.done) return false;
  const d=b.dyn[nodeId], n=node(b,nodeId);
  switch(kind){
    case 'patch': return n.svc[si] && n.svc[si].kind==='vuln' && !d.svc[si].patched;
    case 'firewall': return d.fw<3;
    case 'restore': return d.access>=1 && !n.core; // can't "restore" an already-owned core (game over)
    case 'honeypot': return !d.honey && d.access===0 && n.type!=='edge';
  }
  return false;
}
function defDo(b,kind,nodeId,si,bySelf){
  if(!defCanDo(b,kind,nodeId,si)) return false;
  b.defOps-=DEF[kind].cost;
  const d=b.dyn[nodeId], n=node(b,nodeId);
  switch(kind){
    case 'patch': d.svc[si].patched=true; break;
    case 'firewall': d.fw++; break;
    case 'restore': d.access=0; b.alarm[nodeId]=now()+600; break;
    case 'honeypot': d.honey=true; break;
  }
  const label=`${DEF[kind].label} ${n.name}`;
  addLog(bySelf?'you':'def', (bySelf?'you ':'defence: ')+label.toLowerCase());
  if(bySelf) sfx.tap();
  pushState();
  return true;
}

/* AI defender: periodically hardens the most threatened node. */
function aiDefend(b,dt){
  if(b.defKind!=='ai'||b.done) return;
  b.defCd-=dt;
  if(b.defCd>0) return;
  const interval = [5.5,4,2.6][clamp(G.difficulty-1,0,2)];
  b.defCd=interval;
  if(b.defOps<2) return;
  // threat score per node: access depth + proximity to core
  const coreId=L(b).nodes.find(n=>n.core).id;
  const dist=bfsDist(b,coreId);
  let best=null,bestScore=-1,bestAct=null;
  for(const n of L(b).nodes){
    const d=b.dyn[n.id];
    const prox = 1/(1+(dist[n.id]||9));
    // restore a breached node near core
    if(d.access>=1 && !n.core && defCanDo(b,'restore',n.id)){
      const s=(2+d.access)*prox*3; if(s>bestScore){bestScore=s;best=n.id;bestAct=['restore',n.id,-1];}
    }
    // patch an exploitable service on a reachable/discovered node near core
    n.svc.forEach((s,i)=>{ if(s.kind==='vuln'&&!d.svc[i].patched&&defCanDo(b,'patch',n.id,i)){
      const sc=(d.scanned?2:1)*prox*2+ (reachable(b,n.id)?1:0); if(sc>bestScore){bestScore=sc;best=n.id;bestAct=['patch',n.id,i];} }});
    // firewall a foothold node
    if(d.access>=1 && defCanDo(b,'firewall',n.id)){ const s=prox*1.5; if(s>bestScore){bestScore=s;best=n.id;bestAct=['firewall',n.id,-1];} }
  }
  if(bestAct) defDo(b,bestAct[0],bestAct[1],bestAct[2],false);
}
function bfsDist(b,from){
  const dist={[from]:0}, q=[from];
  while(q.length){ const c=q.shift(); for(const l of node(b,c).links){ if(dist[l]==null){dist[l]=dist[c]+1;q.push(l);} } }
  return dist;
}

/* =========================================================================
   MAIN LOOP
   ========================================================================= */
let lastT=now();
function loop(){
  const t=now(), dt=Math.min(.05,(t-lastT)/1000); lastT=t;
  if(G.running){
    // host (or solo) advances the world
    const amHost = NET.mode!=='guest';
    for(const pid in G.atk){
      if(pid!==G.me && NET.mode!=='solo' && amHost){ /* remote attacker ops advanced below via their reported op */ }
    }
    // advance local op always; advance remote ops only on host
    for(const pid in G.atk){
      const a=G.atk[pid]; if(!a.op) continue;
      const canAdvance = (pid===G.me) || amHost;
      if(!canAdvance) continue;
      a.op.t+=dt;
      if(a.op.t>=a.op.dur){ finishOp(pid); }
    }
    if(amHost){
      for(const b of G.boards){ aiDefend(b,dt);
        b.defOps=Math.min(b.defMax, b.defOps + dt*(0.5+0.15*G.difficulty)); }
      if(G.timeLeft>0){ G.timeLeft-=dt; if(G.timeLeft<=0){ G.timeLeft=0; timeUp(); } }
    }
    // slow trace decay when idle & no active op (keeps sandbox calm)
    if(amHost){ for(const b of G.boards){ const anyOp=Object.values(G.atk).some(a=>a.op&&G.boards[a.op.board]===b);
      if(!anyOp && b.trace>0) b.trace=Math.max(0,b.trace-dt*1.2); } }
  }
  renderTick();
  if(NET.mode!=='solo') NET.tick(dt);
  requestAnimationFrame(loop);
}

function timeUp(){
  // attacker failed to breach in time
  if(G.mode==='ai'){ endMatch(null,'timeout'); }
  else if(G.mode==='defend'){ endMatch(G.defenderPid,'held'); }
  else if(G.mode==='duel'){ // whoever is deeper wins; tie = defender-ish draw
    const dA=depth(G.boards[1]), dB=depth(G.boards[0]); // host attacks board1
    endMatch(dA===dB?null:(dA>dB?'host':'guest'),'duel-time'); }
}
function depth(b){ let m=0; for(const n of L(b).nodes){const d=b.dyn[n.id]; m=Math.max(m, d.access*10 + (d.scanned?1:0));} return m; }

/* =========================================================================
   END / RESULTS
   ========================================================================= */
function endMatch(winnerPid,reason){
  G.running=false; for(const b of G.boards)b.done=true;
  const mine = winnerPid===G.me;
  let title,cls,big;
  if(G.mode==='coop'){
    if(reason==='coop-fail'){ title='MISSION FAILED';cls='lose';big='The intrusion response locked you out. Regroup and try again.';sfx.lose(); }
    else { title='CORE OWNED';cls='win';big='You and your squadmate breached the core together.';sfx.win(); }
  } else if(G.mode==='duel'){
    if(!winnerPid){ title='DRAW';cls='';big='Time ran out with both sides even.'; }
    else { title=mine?'YOU WIN':'YOU LOSE';cls=mine?'win':'lose';big=mine?'You rooted your rival\'s core first.':'Your rival rooted your core first.'; mine?sfx.win():sfx.lose(); }
  } else if(G.mode==='defend'){
    const iAtk = G.role!=='def';
    if(winnerPid && G.atk[winnerPid]){ // attacker won
      title=iAtk?'BREACH COMPLETE':'SERVER BREACHED';cls=iAtk?'win':'lose';big=iAtk?'You owned the core.':'The attacker reached your core.'; iAtk?sfx.win():sfx.lose();
    } else { // defender held
      title=iAtk?'LOCKED OUT':'SERVER HELD';cls=iAtk?'lose':'win';big=iAtk?'The defender repelled you.':'You repelled the attacker.'; iAtk?sfx.lose():sfx.win();
    }
  } else { // solo ai / sandbox
    if(winnerPid){ title='CORE OWNED';cls='win';big='You reached root on the core. Clean work.';sfx.win(); }
    else { title='TIME\'S UP';cls='lose';big='The core held. The window closed before you got root.';sfx.lose(); }
  }
  const b=atkBoardOf(G.me)||G.boards[0];
  const el=$('endCard');
  const elapsed=Math.round((now()-G.t0)/1000);
  el.innerHTML=`
    <h2 class="${cls}">${title}</h2>
    <div class="big mono">${big}</div>
    <div class="statgrid">
      <div class="stat"><div class="v mono">${fmtTime(elapsed)}</div><div class="k">time taken</div></div>
      <div class="stat"><div class="v mono">${Math.round((b.trace))}%</div><div class="k">final trace</div></div>
      <div class="stat"><div class="v mono">${b.kicks}</div><div class="k">times detected</div></div>
      <div class="stat"><div class="v mono">${(myAtk()?myAtk().intel:0)}</div><div class="k">intel stolen</div></div>
    </div>
    <div class="row">
      <button class="btn pri" id="againBtn">${G.mode==='sandbox'?'Keep playing':'Play again'}</button>
      <button class="btn ghost" id="menuBtn">Main menu</button>
    </div>`;
  $('endOv').classList.add('on');
  $('menuBtn').onclick=()=>{ $('endOv').classList.remove('on'); toMenu(); };
  $('againBtn').onclick=()=>{ $('endOv').classList.remove('on');
    if(G.mode==='sandbox'){ G.running=true; for(const bb of G.boards)bb.done=false; return; }
    if(NET.mode==='host'){ NET.restart(); } else if(NET.mode==='guest'){ toast('Waiting for host to restart…'); }
    else restartSolo(); };
  if(NET.mode!=='solo') pushState();
}
let lastSolo=null;
function restartSolo(){ if(lastSolo) startMatch(lastSolo.mode,lastSolo.opts); }

function showGame(){ $('menu').classList.remove('on'); $('game').classList.add('on'); layoutBoard(); }
function toMenu(){
  G.running=false;
  if(NET.mode!=='solo'){ NET.leaveSquad(); }
  $('game').classList.remove('on'); $('menu').classList.add('on'); $('endOv').classList.remove('on');
  buildMenu();
}

function curAtkBoardIdx(){ return G.atk[G.me]?G.atk[G.me].atkBoard:0; }
function shownBoardObj(){ return G.boards[G.shownBoard]||G.boards[0]; }

function layoutBoard(){
  // board tabs for duel (attack / defend views)
  const tabs=$('boardtabs');
  if(G.mode==='duel'){
    tabs.style.display='flex';
    const atkIdx=myAtk().atkBoard, defIdx=myAtk().homeBoard;
    tabs.innerHTML=`
      <button data-b="${atkIdx}" class="${G.shownBoard===atkIdx?'sel':''}">⚔ ATTACK — rival core</button>
      <button data-b="${defIdx}" class="def ${G.shownBoard===defIdx?'sel':''}">🛡 DEFEND — your core</button>`;
    tabs.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{ G.shownBoard=+btn.dataset.b; G.selNode=null; layoutBoard(); sfx.sel(); });
  } else if(G.mode==='defend'){
    tabs.style.display='none';
  } else tabs.style.display='none';
  buildNodes();
  buildSheet();
  renderMeters();
}

function myViewRole(){
  // on the shown board, am I attacking or defending it?
  if(G.mode==='duel') return G.shownBoard===myAtk().homeBoard?'def':'atk';
  if(G.mode==='defend') return G.role==='def'?'def':'atk';
  return 'atk';
}

function buildNodes(){
  const b=shownBoardObj(), map=$('map'), svg=$('links');
  // clear old nodes
  [...map.querySelectorAll('.node')].forEach(e=>e.remove());
  // links
  let lk='';
  const seen=new Set();
  for(const n of L(b).nodes){ const d=b.dyn[n.id];
    for(const l of n.links){ const key=[n.id,l].sort().join('-'); if(seen.has(key))continue; seen.add(key);
      const m=node(b,l), dm=b.dyn[l];
      const on = (d.disc&&dm.disc);
      const hot = (d.access>=1||dm.access>=1);
      lk+=`<line x1="${n.x}" y1="${n.y}" x2="${m.x}" y2="${m.y}" stroke="${on?(hot?'#39e0a6':'#28384f'):'#162231'}" stroke-width="${hot?2:1.4}" vector-effect="non-scaling-stroke" ${on?'':'stroke-dasharray="3 3"'} opacity="${on?.9:.4}"/>`;
    }}
  svg.innerHTML=lk;
  // nodes
  for(const n of L(b).nodes){
    const d=b.dyn[n.id];
    const el=document.createElement('div'); el.className='node';
    const cls=[];
    if(!d.disc) cls.push('undisc');
    if(d.access===1) cls.push('foot'); if(d.access>=2) cls.push('root');
    if(n.core) cls.push('core');
    if(G.selNode===n.id) cls.push('sel');
    if(b.alarm[n.id]&&b.alarm[n.id]>now()) cls.push('alarm');
    const op=opOnNode(n.id,b);
    if(op) cls.push('busy');
    el.className='node '+cls.join(' ');
    el.style.left=n.x+'%'; el.style.top=n.y+'%';
    const icon = d.disc? (TYPE_ICON[n.type]||'💻') : '❔';
    const subt = d.disc? (d.access>=2?'root':d.access>=1?'user':(d.scanned?'scanned':'exposed')) : 'unknown';
    el.innerHTML=`
      <div class="chip">${icon}
        <div class="ring"></div>
        ${d.fw?`<div class="fw">🧱${d.fw}</div>`:''}
        ${d.honey?`<div class="hp">🍯</div>`:''}
      </div>
      <div class="nm">${d.disc?n.name:'• • •'}</div>
      <div class="sub">${subt}</div>`;
    el.onclick=()=>{ if(!d.disc){ sfx.bad(); return; } selectNode(n.id); };
    map.appendChild(el);
  }
}
function opOnNode(id,b){
  const bi=G.boards.indexOf(b);
  for(const pid in G.atk){ const a=G.atk[pid]; if(a.op&&a.op.nodeId===id&&a.op.board===bi) return a; }
  return null;
}

function selectNode(id){ G.selNode=id; sfx.sel(); buildNodes(); buildSheet(); }

function buildSheet(){
  const b=shownBoardObj(), sheet=$('sheet');
  const view=myViewRole();
  if(!G.selNode){ sheet.innerHTML=`<div class="hint-empty">Tap a node to inspect it.</div>`; return; }
  const n=node(b,G.selNode), d=b.dyn[G.selNode];
  const accCls=d.access>=2?'root':d.access>=1?'foot':'';
  const accTxt=d.access>=2?'ROOT':d.access>=1?'USER':'NO ACCESS';
  // services
  let svcHtml='';
  if(d.scanned){
    n.svc.forEach((s,i)=>{ const st=d.svc[i]; const info=SVC[s.k];
      let tag='';
      if(s.kind==='vuln') tag= st.patched?`<span class="pa">patched</span>`:`<span class="vn">vulnerable</span>`;
      else if(s.kind==='login') tag=`<span class="lk">needs login</span>`;
      else tag=`<span>ok</span>`;
      svcHtml+=`<div class="svc">${info.icon} ${info.label} <span class="pt">:${info.port}</span> — ${tag}</div>`;
    });
  } else if(d.disc){ svcHtml = (view==='atk' && !reachable(b,n.id))
      ? `<div class="svc" style="color:var(--warn)">out of reach — break into a machine linked to this one first</div>`
      : `<div class="svc">services unknown — run a scan</div>`; }
  else svcHtml=`<div class="svc">not yet discovered</div>`;

  // action buttons depend on view
  let acts='';
  if(view==='atk'){
    const a=myAtk();
    const busy=!!a.op;
    const btn=(kind,enabled,extra,label,si)=>`<button class="act" ${enabled?'':'disabled'} data-act="${kind}" data-si="${si==null?-1:si}"><b>${OP[kind].icon} ${label||OP[kind].label}</b><span>${extra||OP[kind].desc}</span></button>`;
    // Only show actions that still make sense here: scan until scanned, a way
    // in until you have one, escalate at foothold, harvest at root, cover when hot.
    if(!d.scanned) acts+=btn('scan', !busy&&canDo(G.me,'scan',n.id), `+${OP.scan.trace}% trace · ${OP.scan.sec}s`);
    if(d.scanned && d.access<1){
      n.svc.forEach((s,i)=>{
        if(s.kind==='vuln') acts+=btn('exploit', !busy&&canDo(G.me,'exploit',n.id,i), `${SVC[s.k].label} · +${OP.exploit.trace}%`, 'Exploit '+SVC[s.k].label, i);
        if(s.kind==='login'){ const fast=a.creds.has(b.owner+':*'); acts+=btn('crack', !busy&&canDo(G.me,'crack',n.id,i), `${SVC[s.k].label}${fast?' · creds!':''} · +${OP.crack.trace}%`, 'Crack '+SVC[s.k].label, i); }
      });
    }
    if(d.access===1) acts+=btn('escalate', !busy&&canDo(G.me,'escalate',n.id), n.core?'take the core →':null);
    if(n.loot && d.access>=2 && !d.looted) acts+=btn('harvest', !busy&&canDo(G.me,'harvest',n.id));
    if(b.trace>5) acts+=btn('cover', !busy&&canDo(G.me,'cover',n.id), `${OP.cover.trace}% trace · ${OP.cover.sec}s`);
  } else { // defending this board
    const dbtn=(kind,enabled,label,extra,si)=>`<button class="act def" ${enabled?'':'disabled'} data-def="${kind}" data-si="${si==null?-1:si}"><b>${DEF[kind].icon} ${label||DEF[kind].label}</b><span>${extra||DEF[kind].desc} · ${DEF[kind].cost}⚡</span></button>`;
    n.svc.forEach((s,i)=>{ if(s.kind==='vuln') acts+=dbtn('patch', defCanDo(b,'patch',n.id,i), 'Patch '+SVC[s.k].label, 'remove flaw', i); });
    acts+=dbtn('firewall', defCanDo(b,'firewall',n.id));
    acts+=dbtn('restore', defCanDo(b,'restore',n.id));
    acts+=dbtn('honeypot', defCanDo(b,'honeypot',n.id));
  }

  const opNote = (()=>{ const a=opOnNode(n.id,b); if(!a)return '';
    return `<div class="svc op-note" style="color:var(--warn)">▸ ${OP[a.op.kind].verb}… <span class="op-pct">${Math.round(a.op.t/a.op.dur*100)}</span>%</div>`; })();

  sheet.innerHTML=`
    <div class="sh">
      <div class="chip2">${d.disc?(TYPE_ICON[n.type]||'💻'):'❔'}</div>
      <div class="ti"><b>${d.disc?n.name:'unknown host'}</b><span>${n.core?'★ core target':n.type}${d.fw?` · firewall ${d.fw}`:''}</span></div>
      <span class="acc-state ${accCls}">${view==='atk'?accTxt:(d.access>=1?'BREACHED':'secure')}</span>
    </div>
    ${svcHtml}
    ${opNote}
    <div class="actions">${acts||'<div class="hint-empty">nothing to do here</div>'}</div>`;

  sheet.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=()=>{
    const kind=btn.dataset.act, si=+btn.dataset.si;
    doAttack(kind,n.id,si);
  });
  sheet.querySelectorAll('[data-def]').forEach(btn=>btn.onclick=()=>{
    const kind=btn.dataset.def, si=+btn.dataset.si;
    doDefend(kind,n.id,si);
  });
}

function doAttack(kind,nodeId,si){
  audio();
  if(NET.mode==='guest'){
    // request host to run it (guest can't mutate authoritative board)
    if(!canDoLocalPreview(kind,nodeId,si)){ sfx.bad(); return; }
    NET.out('op',kind,nodeId,si);
    // optimistic local op so the guest sees progress; host is source of truth
    beginOp(G.me,kind,nodeId,si);
  } else {
    if(!beginOp(G.me,kind,nodeId,si)){ sfx.bad(); return; }
  }
  buildSheet();
  if(NET.mode!=='solo') pushState();
}
function canDoLocalPreview(kind,nodeId,si){ return canDo(G.me,kind,nodeId,si); }

function doDefend(kind,nodeId,si){
  audio();
  const b=shownBoardObj(), bi=G.boards.indexOf(b);
  if(NET.mode==='guest'){
    // host owns every board; send the request and apply optimistically.
    if(!defCanDo(b,kind,nodeId,si)){ sfx.bad(); return; }
    NET.out('def',kind,nodeId,si,bi);
    defDo(b,kind,nodeId,si,true); uiRefresh(); return;
  }
  defDo(b,kind,nodeId,si,true);
  uiRefresh();
  if(NET.mode!=='solo') pushState();
}

function renderMeters(){
  const b=shownBoardObj();
  const m=$('meters');
  const view=myViewRole();
  let html='';
  // trace meter (attacker's exposure on this board)
  const tcls = b.trace>75?'bad':b.trace>45?'warn':'';
  html+=`<div class="meter"><div class="ml"><span>${view==='atk'?'YOUR TRACE':'INTRUSION'}</span><b class="${tcls?'':''}" style="color:${b.trace>75?'var(--bad)':b.trace>45?'var(--warn)':'var(--acc)'}">${Math.round(b.trace)}%</b></div><div class="bar trace"><i style="width:${b.trace}%"></i></div></div>`;
  if(view==='def'||G.mode==='defend'&&G.role==='def'){
    html+=`<div class="meter"><div class="ml"><span>DEFENCE ENERGY</span><b>${Math.floor(b.defOps)}⚡</b></div><div class="bar prog"><i style="width:${b.defOps/b.defMax*100}%"></i></div></div>`;
  } else {
    // progress toward core
    const p=progressPct(b);
    html+=`<div class="meter"><div class="ml"><span>BREACH PROGRESS</span><b>${p}%</b></div><div class="bar prog"><i style="width:${p}%"></i></div></div>`;
  }
  m.innerHTML=html;
}
function progressPct(b){
  // crude: fraction of path depth achieved toward core
  const coreId=L(b).nodes.find(n=>n.core).id, d=b.dyn[coreId];
  if(d.access>=2) return 100;
  let owned=0,tot=0; for(const n of L(b).nodes){ tot++; owned+=Math.min(d===b.dyn[n.id]?0:0,0)+ (b.dyn[n.id].access>=2?1:b.dyn[n.id].access>=1?0.6:b.dyn[n.id].scanned?0.15:0); }
  return clamp(Math.round(owned/tot*100),0,99);
}

function renderTick(){
  if(!$('game').classList.contains('on')) return;
  // clock
  const c=$('clock');
  if(G.timeLeft>0){ const tl=Math.ceil(G.timeLeft); c.textContent=fmtTime(tl); c.className='clock mono '+(tl<=20?'bad':tl<=60?'warn':''); }
  else if(G.mode==='coop'){ c.textContent='CO-OP'; c.className='clock mono'; }
  else if(G.mode==='sandbox'){ c.textContent='∞'; c.className='clock mono'; }
  else { c.textContent=''; }
  // objective
  const b=shownBoardObj();
  const coreName=L(b).nodes.find(n=>n.core).name;
  $('objLabel').textContent = myViewRole()==='def'?'DEFEND':'OBJECTIVE';
  $('objVal').textContent = myViewRole()==='def'?`keep them out of ${coreName}`:`get root on ${coreName}`;
  // busy rings / progress — rebuild sheet op note & node spinners cheaply
  updateBusy();
  renderMeters();
}
let lastBusyKey='';
function updateBusy(){
  const b=shownBoardObj(), bi=G.boards.indexOf(b);
  let key=bi+'|';
  // signature of discrete board state: which nodes have an op, plus access /
  // firewall / honeypot / patched / discovery. Changes only on real events, so
  // the map rebuilds then (keeping CSS spinners smooth between events).
  for(const pid in G.atk){ const a=G.atk[pid]; if(a.op&&a.op.board===bi) key+=pid+':'+a.op.nodeId+';'; }
  for(const n of L(b).nodes){ const d=b.dyn[n.id]; key+=(d.disc?1:0)+''+(d.scanned?1:0)+d.access+d.fw+(d.honey?1:0)+'.'; }
  if(key!==lastBusyKey){ lastBusyKey=key; buildNodes(); if($('game').classList.contains('on')&&G.selNode) buildSheet(); }
  // live progress text on the selected node's op note, every frame
  if(G.selNode){ const a=opOnNode(G.selNode,b);
    const pct=$('sheet').querySelector('.op-pct');
    if(a&&pct) pct.textContent=Math.round(a.op.t/a.op.dur*100);
  }
}

function renderFeed(){
  const f=$('feed'); if(!f)return;
  f.innerHTML = G.log.slice(-7).reverse().map(l=>`<div class="ln ${l.kind}">${escapeHtml(l.msg)}</div>`).join('');
}
function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmtTime(s){ const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }

let toastT=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }

/* =========================================================================
   NETWORKING  (room capability — lobby + squad, host authoritative)
   Mirrors the proven Breachpoint pattern.
   ========================================================================= */
const NET={
  mode:'solo', avail:'connecting', lobby:null, squad:null, code:null, partner:null, pp:null,
  sid:Math.random().toString(36).slice(2,10), seq:0, ring:[], lastIn:-1, lastSid:null,
  lobbyPeers:[], sendAt:0, wantMode:null, wantRole:'atk', run:0,
  out(kind,...vals){ if(this.mode==='solo'||!this.partner) return; this.seq++; this.ring.push({at:now(),e:[this.seq,kind,...vals]}); this.send(true); },
  tick(dt){ this.send(false); },
  send(force){ if(!this.squad)return; const t=now(); if(!force&&t-this.sendAt<70)return; this.sendAt=t;
    this.squad.presence(this.snapshot()).catch(()=>{}); },
  snapshot(){
    const t=now(); this.ring=this.ring.filter(o=>t-o.at<1800).slice(-30);
    const ev=this.ring.map(o=>o.e);
    const base={sid:this.sid,role:this.mode,ev,run:this.run,inGame:G.running||(G.mode&&$('game').classList.contains('on'))?1:0};
    if(this.mode==='host'){ base.state=encodeState(); base.mode=G.mode; base.phase=G.running?'play':(G.mode?'end':'lobby'); }
    else { if(G.atk[this.sid==='x'?'':'guest']){} base.myop = G.atk.guest&&G.atk.guest.op? [G.atk.guest.op.kind,G.atk.guest.op.nodeId,G.atk.guest.op.si,Math.round(G.atk.guest.op.t*100)] : null; }
    return base;
  },
  recv(){
    const pp=this.pp; if(!pp) return;
    const evs=Array.isArray(pp.ev)?pp.ev:[];
    const maxSeq=evs.reduce((m,e)=>Math.max(m,+e[0]||0),-1);
    if(pp.sid!==this.lastSid){ this.lastSid=pp.sid; this.lastIn=maxSeq; }
    for(const ev of evs){ if(ev[0]>this.lastIn) handleNetEvent(ev); }
    this.lastIn=Math.max(this.lastIn,maxSeq);
    if(this.mode==='guest' && pp.state){ applyHostState(pp); }
    if(this.mode==='host' && pp.myop!==undefined){ /* host advances guest op from requests only */ }
  },
  restart(){ this.run++; if(this.wantMode) hostStart(this.wantMode); },
  leaveSquad(msg){ const sq=this.squad; this.squad=null; if(sq)sq.leave().catch(()=>{});
    if(this.lobby) this.lobby.presence({squad:null,open:null}).catch(()=>{});
    this.mode='solo'; this.code=null; this.partner=null; this.pp=null; this.run=0;
    if(msg)toast(msg); buildMenu(); $('game').classList.remove('on'); $('menu').classList.add('on'); $('endOv').classList.remove('on'); },
};

async function initNet(){
  let room=null;
  try{ room = window.claude&&window.claude.use? await window.claude.use('room'):null; }catch(e){ room=null; }
  if(!room){ NET.avail='off'; renderCoop(); return; }
  NET.lobby=room; NET.avail='on';
  room.onPeers(ch=>{ NET.lobbyPeers=ch.peers; renderCoop(); }, ()=>{ NET.avail='off'; NET.lobby=null; renderCoop(); });
  renderCoop();
}

const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
async function hostSquad(mode){
  if(!NET.lobby||NET.squad) return;
  const code=Array.from({length:4},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
  try{ NET.squad=await NET.lobby.join('rk-'+code.toLowerCase()); }catch(e){ toast('Could not open a room. Try again'); return; }
  NET.mode='host'; NET.code=code; NET.partner=null; NET.pp=null; NET.wantMode=mode;
  NET.squad.onPeers(onSquadPeers,()=>NET.leaveSquad('Room connection lost'));
  NET.lobby.presence({squad:code,open:true,gm:mode}).catch(()=>{});
  renderCoop();
}
async function joinSquad(code){
  if(!NET.lobby||NET.squad||!/^[A-Z0-9]{4}$/.test(code)) return;
  try{ NET.squad=await NET.lobby.join('rk-'+code.toLowerCase()); }catch(e){ toast('Could not join that room'); return; }
  NET.mode='guest'; NET.code=code; NET.partner=null; NET.pp=null; NET.run=0;
  NET.squad.onPeers(onSquadPeers,()=>NET.leaveSquad('The host left'));
  renderCoop();
}
function onSquadPeers(ch){
  const want = NET.mode==='host'?'guest':'host';
  const cands=ch.peers.filter(p=>!p.sameTab&&p.presence&&p.presence.role===want);
  const p=cands.find(c=>c.peer===NET.partner)||cands[0];
  if(p){
    if(NET.partner!==p.peer){ NET.partner=p.peer; if(G.running)toast('Partner connected'); sfx.done(); }
    NET.pp=p.presence; NET.recv();
  } else if(NET.partner){
    NET.partner=null; NET.pp=null;
    if(NET.mode==='guest'){ NET.leaveSquad('The host left the room'); return; }
    if(G.running) toast('Your partner disconnected');
  }
  if(NET.mode==='host'&&NET.lobby) NET.lobby.presence({squad:NET.code,open:!NET.partner,gm:NET.wantMode}).catch(()=>{});
  renderCoop();
}
function pushState(){ if(NET.mode!=='solo') NET.send(true); }

// host begins the chosen mode for both players
function hostStart(mode){
  NET.wantMode=mode;
  NET.run++;              // bump first so the very first snapshot carries the new run id
  let opts={};
  if(mode==='coop'){ opts={level:'bank',difficulty:2}; startMatch('coop',opts); }
  else if(mode==='duel'){ opts={time:300}; startMatch('duel',opts); }
  else if(mode==='defend'){ opts={level:'office',atkPid:'host',time:360}; G.role='atk'; startMatch('defend',opts); }
  pushState();
}

/* ---------- state encoding (host -> guest) ---------- */
function encodeState(){
  const boards=G.boards.map(b=>({
    lvl:b.lvl, owner:b.owner, trace:Math.round(b.trace), kicks:b.kicks, defOps:Math.round(b.defOps), defKind:b.defKind, done:b.done?1:0, winner:b.winner||null,
    d:L(b).nodes.map(n=>{ const d=b.dyn[n.id]; return [d.disc?1:0,d.scanned?1:0,d.access,d.fw,d.honey?1:0,d.looted?1:0, d.svc.map(s=>s.patched?1:0).join('')]; })
  }));
  const atk={};
  for(const pid in G.atk){ const a=G.atk[pid]; atk[pid]={creds:[...a.creds],intel:a.intel,kicks:a.kicks,
    op:a.op?[a.op.kind,a.op.nodeId,a.op.si,Math.round(a.op.t*100),Math.round(a.op.dur*100),a.op.board]:null,
    homeBoard:a.homeBoard,atkBoard:a.atkBoard}; }
  return {mode:G.mode,boards,atk,time:Math.round(G.timeLeft),run:NET.run,defenderPid:G.defenderPid||null,role:G.role||'atk'};
}
function applyHostState(pp){
  const s=pp.state; if(!s) return;
  const freshRun = s.run!==NET.run;
  if(!G.mode || freshRun || G.mode!==s.mode){
    // (re)build match structure to mirror host
    NET.run=s.run; buildGuestMatch(s);
  }
  if(!G.boards.length) return;
  // apply dynamic state
  s.boards.forEach((bs,bi)=>{ const b=G.boards[bi]; if(!b)return;
    b.trace=bs.trace; b.kicks=bs.kicks; b.defOps=bs.defOps; b.done=!!bs.done; b.winner=bs.winner;
    L(b).nodes.forEach((n,ni)=>{ const dd=bs.d[ni]; const d=b.dyn[n.id];
      d.disc=!!dd[0]; d.scanned=!!dd[1]; d.access=dd[2]; d.fw=dd[3]; d.honey=!!dd[4]; d.looted=!!dd[5];
      d.svc.forEach((sv,si)=>sv.patched = dd[6][si]==='1');
    });
  });
  for(const pid in s.atk){ const as=s.atk[pid]; if(!G.atk[pid])continue;
    G.atk[pid].intel=as.intel; G.atk[pid].kicks=as.kicks; G.atk[pid].creds=new Set(as.creds);
    // Mirror the partner's op from the host. Leave my OWN op alone — it runs on
    // my local timer (optimistic), and the host's authoritative world state
    // above corrects any drift when it completes.
    if(pid!==G.me){ G.atk[pid].op = as.op? {kind:as.op[0],nodeId:as.op[1],si:as.op[2],t:as.op[3]/100,dur:as.op[4]/100,board:as.op[5]} : null; }
  }
  G.timeLeft=s.time;
  if(s.mode==='defend'){ G.defenderPid=s.defenderPid; G.role = (G.me===s.defenderPid)?'def':'atk'; }
  // detect end
  const done=G.boards.some(b=>b.done);
  if(done && G.running){ G.running=false; const w=G.boards.map(b=>b.winner).find(x=>x); endMatch(w|| (s.mode==='coop'&&G.boards[0].kicks>=3?null:w), 'net'); }
  if(!$('game').classList.contains('on') && s.mode && pp.inGame){ showGame(); }
  if($('game').classList.contains('on')){ if(!G.selNode){ const b=atkBoardOf(G.me); if(b){const e=L(b).nodes.find(n=>n.type==='edge'); if(e)G.selNode=e.id;} } layoutBoard(); }
}
function buildGuestMatch(s){
  G.mode=s.mode; G.me='guest'; G.boards=[]; G.atk={}; G.selNode=null; G.log=G.log||[]; G.running=true; G.t0=now();
  s.boards.forEach(bs=>{ const b=makeBoard(bs.lvl,bs.owner); b.defKind=bs.defKind; G.boards.push(b); });
  for(const pid in s.atk){ const as=s.atk[pid]; G.atk[pid]={creds:new Set(as.creds),intel:as.intel,op:null,homeBoard:as.homeBoard,atkBoard:as.atkBoard,kicks:as.kicks}; }
  G.defenderPid=s.defenderPid; G.role = s.mode==='defend'? (G.me===s.defenderPid?'def':'atk') : 'atk';
  G.timeLeft=s.time;
  G.shownBoard = s.mode==='duel'? G.atk.guest.atkBoard : 0;
  showGame();
}

// guest requests; host is authoritative and applies them.
// event shapes: [seq,'op',opKind,nodeId,si]  /  [seq,'def',defKind,nodeId,si,boardIdx]
function handleNetEvent(ev){
  const kind=ev[1];
  if(NET.mode==='host'){
    if(kind==='op'){ const k=ev[2],nodeId=ev[3],si=ev[4]; beginOp('guest',k,nodeId,si); pushState(); }
    else if(kind==='def'){ const k=ev[2],nodeId=ev[3],si=ev[4],bi=ev[5];
      const b=G.boards[bi]; if(b) defDo(b,k,nodeId,si,false); pushState(); }
  }
}

/* ---------- co-op panel render ---------- */
let coopSig='';
function renderCoop(){
  const el=$('coop'); if(!el) return;
  const open=NET.lobbyPeers.filter(p=>!p.sameTab&&p.presence&&typeof p.presence.squad==='string'&&p.presence.open&&/^[A-Z0-9]{4}$/.test(p.presence.squad))
    .map(p=>({c:p.presence.squad,gm:p.presence.gm}));
  const sig=[NET.avail,NET.mode,NET.code,!!NET.partner,NET.wantMode,open.map(o=>o.c+o.gm).join(',')].join('|');
  if(sig===coopSig) return; coopSig=sig;
  let h='';
  if(NET.avail==='connecting') h=`<div class="coop-h"><b>Two-player</b><span>Connecting…</span></div>`;
  else if(NET.avail==='off') h=`<div class="coop-h"><b>Two-player</b><span>Unavailable here</span></div><p>Multiplayer works when both players open this page on claude.ai or in the Claude app, signed in. Share the page with your friend first, then one of you hosts.</p>`;
  else if(NET.mode==='solo'){
    h=`<div class="coop-h"><b>Two-player</b><span>phone + laptop welcome</span></div>
      <p>Host a room, pick a mode, and share the 4-letter code. Your friend taps Join. Works across any two devices.</p>
      <div class="sub" style="margin:4px 0 8px">HOST A MODE</div>
      <div class="modes">
        ${mcard('co','🤝','Co-op','2 players vs AI','Breach one hardened server together — split the branches and watch each other\'s trace.')}
        ${mcard('ad','⚔️','Attack & Defend','1 attacks · 1 defends','One of you breaks in while the other patches holes and firewalls the path.')}
        ${mcard('vs','🎯','Duel (1v1)','race to root','You each get an identical network. First to root the rival\'s core wins.')}
      </div>
      <div class="sub" style="margin:14px 0 6px">JOIN A ROOM</div>
      <div class="field"><input id="joinInp" maxlength="4" placeholder="CODE" autocomplete="off" inputmode="latin"></div>
      ${open.length?`<div class="open-sq">${open.map(o=>`<div class="sq-row"><span>open room <b class="c">${o.c}</b> <span style="color:var(--faint);font-size:11px">${gmName(o.gm)}</span></span><button class="btn pri sm" data-join="${o.c}">Join</button></div>`).join('')}</div>`:''}`;
  } else if(NET.mode==='host'){
    const started=G.running;
    h=`<div class="coop-h"><b>Your room · ${gmName(NET.wantMode)}</b><span><i class="dot${NET.partner?' live':''}"></i>${NET.partner?'Partner connected':'Waiting…'}</span></div>
      <div class="code">${NET.code}</div>
      <p>${NET.partner?'Partner\'s in. Start when you\'re ready.':'Share this code. Your friend opens this page and taps Join.'}</p>
      <div class="row">
        <button class="btn pri" id="startBtn" ${NET.partner?'':'disabled'}>Start ${gmName(NET.wantMode)}</button>
        <button class="btn ghost sm" id="leaveBtn">Close room</button>
      </div>`;
  } else {
    h=`<div class="coop-h"><b>Room ${NET.code}</b><span><i class="dot${NET.partner?' live':''}"></i>${NET.partner?'Connected':'Finding host…'}</span></div>
      <p>The host picks the mode and starts. You\'ll drop in automatically.</p>
      <div class="row"><button class="btn ghost sm" id="leaveBtn">Leave room</button></div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll('[data-host]').forEach(b=>b.onclick=()=>{ audio();sfx.tap(); hostSquad(b.dataset.host); });
  const ji=$('joinInp'); if(ji){ ji.oninput=()=>{ ji.value=ji.value.toUpperCase().replace(/[^A-Z0-9]/g,''); if(ji.value.length===4){ audio(); joinSquad(ji.value); } }; }
  el.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{ audio(); joinSquad(b.dataset.join); });
  const sb=$('startBtn'); if(sb) sb.onclick=()=>{ audio(); hostStart(NET.wantMode); };
  const lb=$('leaveBtn'); if(lb) lb.onclick=()=>NET.leaveSquad();
}
function mcard(cls,ic,t,pl,d){ return `<button class="mode ${cls}" data-host="${cls==='co'?'coop':cls==='ad'?'defend':'duel'}"><div class="mt"><span class="ic">${ic}</span>${t}</div><div class="pl">${pl}</div><p>${d}</p></button>`; }
function gmName(m){ return {coop:'Co-op',defend:'Attack & Defend',duel:'Duel (1v1)'}[m]||'match'; }

$('primerBtn').onclick=()=>{ audio(); openPrimer(); };
$('helpBtn').onclick=openHelp;
$('backBtn').onclick=()=>{ if(G.mode==='sandbox'||confirmLeave()) toMenu(); };
function confirmLeave(){ return true; }
[$('endOv'),$('primerOv'),$('helpOv')].forEach(ov=>ov.addEventListener('click',e=>{ if(e.target===ov) ov.classList.remove('on'); }));
